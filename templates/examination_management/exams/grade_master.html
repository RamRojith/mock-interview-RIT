{% load static %}
{% load em_tags %}

<!-- Add Grade Entry Modal -->
<div class="modal fade" id="MarkGradeModal" tabindex="-1" aria-labelledby="MarkGradeModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-slide-top shadow-lg rounded-3 border-0">

      <!-- Header -->
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="MarkGradeModalLabel">Add Grade Entry</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <!-- Body -->
      <div class="modal-body">
        <form method="POST" action="">
          {% csrf_token %}

          <!-- Programme of Study -->
          <div class="mb-3">
            <label for="degree" class="form-label">Degree <span class="text-danger">*</span></label>
            <select name="degree" id="degree" class="form-select" required>
              <option value="" disabled selected>Select Programme</option>
              <option value="B.E">B.E (Bachelor of Engineering)</option>
              <option value="B.TECH">B.TECH (Bachelor of Technology)</option>
            </select>
          </div>

          <!-- Regulation -->
          <div class="mb-3">
            <label for="regulation" class="form-label">Regulation <span class="text-danger">*</span></label>
            <select name="regulation" id="regulation" class="form-select" required>
              <option value="" disabled selected>Select Regulation</option>
              {% regulations as regs %}
              {% for reg in regs %}
                <option value="{{ reg.year }}">{{ reg.year }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Mark Range -->
          <div class="mb-3">
            <label for="mark_range" class="form-label">Mark Range <span class="text-danger">*</span></label>
            <input type="text" name="mark_range" id="mark_range" class="form-control" placeholder="Enter range like 80-89" required>
          </div>

          <!-- Grade Point Range -->
          <div class="mb-3">
            <label for="grade_range" class="form-label">Grade Point Range</label>
            <input type="text" name="grade_range" id="grade_range" class="form-control" placeholder="Enter range like 3.5-4.0">
          </div>

          <!-- Class Category -->
          <div class="mb-3">
            <label for="class_category" class="form-label">Class Category</label>
            <select name="class_category" id="class_category" class="form-select">
              <option value="" disabled selected>Select Class Category</option>
              <option value="Distinction">Distinction</option>
              <option value="Upper First Class">Upper First Class</option>
              <option value="Lower First Class">Lower First Class</option>
              <option value="Upper Second Class">Upper Second Class</option>
              <option value="Lower Second Class">Lower Second Class</option>
              <option value="Pass">Pass</option>
              <option value="Failure">Failure</option>
            </select>
          </div>

          <!-- Grade -->
          <div class="mb-3">
            <label for="grade" class="form-label">Grade <span class="text-danger">*</span></label>
            <input type="text" name="grade" id="grade" class="form-control" placeholder="Enter grade (e.g., A+, B, C)" required>
          </div>

          <!-- Save Button -->
          <div class="text-end">
            <button type="submit" class="btn btn-success">Save</button>
          </div>
        </form>
      </div>

      <!-- Footer -->
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>

    </div>
  </div>
</div>

<!-- Slide from Top Animation -->
<style>
.modal-slide-top {
  transform: translateY(-80px);
  opacity: 0;
  transition: all 0.4s ease-in-out;
}
.modal.show .modal-slide-top {
  transform: translateY(0);
  opacity: 1;
}
</style>
