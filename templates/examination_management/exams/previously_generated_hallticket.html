{% extends 'base.html' %}
{% load static %}

{% block content %}
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
    /* Main Container Styles */
    .hall-ticket-container {
        background-color: #f8f9fa;
        border-radius: 10px;
        padding: 2rem;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
        margin-bottom: 2rem;
    }
    
    /* Modal Styles */
    .modal-header {
        background-color: #4e73df;
        color: white;
        border-radius: 10px 10px 0 0;
    }
    
    .modal-content {
        border-radius: 10px;
        border: none;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }
    
    /* Form Styles */
    .form-label {
        font-weight: 600;
        color: #5a5c69;
    }
    
    .form-select {
        border-radius: 8px;
        padding: 0.75rem 1rem;
        border: 1px solid #d1d3e2;
        transition: all 0.3s;
    }
    
    .form-select:focus {
        border-color: #4e73df;
        box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.25);
    }
    
    /* Button Styles */
    .btn-primary {
        background-color: #4e73df;
        border-color: #4e73df;
        padding: 0.75rem 1.5rem;
        font-weight: 600;
        border-radius: 8px;
        transition: all 0.3s;
    }
    
    .btn-primary:hover {
        background-color: #2e59d9;
        border-color: #2e59d9;
        transform: translateY(-1px);
    }
    
    .btn-danger {
        background-color: #e74a3b;
        border-color: #e74a3b;
        padding: 0.75rem 1.5rem;
        font-weight: 600;
        border-radius: 8px;
        transition: all 0.3s;
    }
    
    /* Student Card Styles */
    .student-card {
        background-color: white;
        border-radius: 10px;
        padding: 1.5rem;
        margin-bottom: 2rem;
        box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
        border-left: 4px solid #4e73df;
        transition: transform 0.3s;
    }
    
    .student-card:hover {
        transform: translateY(-3px);
    }
    
    .student-header {
        border-bottom: 1px solid #e3e6f0;
        padding-bottom: 1rem;
        margin-bottom: 1rem;
    }
    
    .student-photo {
        border: 3px solid #e3e6f0;
        border-radius: 8px;
    }
    
    /* Course Table Styles */
    .course-table {
        border-radius: 8px;
        overflow: hidden;
        width: 100%;
        table-layout: auto;
    }
    
    .course-table thead th {
        background-color: #4e73df;
        color: white;
        font-weight: 600;
        border: none;
        white-space: nowrap;
        padding: 12px 15px;
    }
    
    .course-table tbody td {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 10px 15px;
    }
    
    .course-table tbody tr:nth-child(even) {
        background-color: #f8f9fc;
    }
    
    .course-table tbody tr:hover {
        background-color: rgba(78, 115, 223, 0.1);
    }
    
    /* Column Widths */
    .course-table th:nth-child(1), 
    .course-table td:nth-child(1) {
        width: 15%;
        min-width: 100px;
    }
    
    .course-table th:nth-child(2), 
    .course-table td:nth-child(2) {
        width: 40%;
        min-width: 200px;
        white-space: normal;
    }
    
    .course-table th:nth-child(3), 
    .course-table td:nth-child(3) {
        width: 10%;
        min-width: 80px;
    }
    
    .course-table th:nth-child(4), 
    .course-table td:nth-child(4) {
        width: 15%;
        min-width: 100px;
    }
    
    .course-table th:nth-child(5), 
    .course-table td:nth-child(5) {
        width: 20%;
        min-width: 120px;
    }
    
    /* Student Section with Scroll */
    #studentSection {
        display: none;
        margin-top: 2rem;
        max-height: 70vh;
        overflow-y: auto;
        padding-right: 15px;
    }
    
    /* PDF Download Button Container */
    .pdf-download-wrapper {
        position: sticky;
        top: 20px;
        z-index: 1000;
        display: flex;
        justify-content: flex-end;
        margin-bottom: 1rem;
    }
    
    /* Responsive Styles */
    @media (max-width: 768px) {
        .student-card .row {
            flex-direction: column-reverse;
        }
        
        .student-photo-container {
            text-align: center;
            margin-bottom: 1rem;
        }
        
        .hall-ticket-container {
            padding: 1rem;
        }
        
        #studentSection {
            max-height: none;
            overflow-y: visible;
        }
        
        .pdf-download-wrapper {
            position: static;
            justify-content: center;
        }
        
        .course-table {
            display: block;
            overflow-x: auto;
        }
        
        .course-table th, 
        .course-table td {
            white-space: nowrap;
        }
    }
    
    /* Custom Scrollbar */
    #studentSection::-webkit-scrollbar {
        width: 8px;
    }
    
    #studentSection::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
    }
    
    #studentSection::-webkit-scrollbar-thumb {
        background: #4e73df;
        border-radius: 10px;
    }
    
    #studentSection::-webkit-scrollbar-thumb:hover {
        background: #2e59d9;
    }
</style>

<div class="container mt-4">
    <div class="hall-ticket-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0 text-gray-800">
                <i class="fas fa-ticket-alt me-2"></i>Previously Generated Hall Ticket
            </h1>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#hallTicketModal">
                <i class="fas fa-plus me-2"></i>Open Previously Generated Hall Ticket
            </button>
        </div>
    </div>

    <!-- Student Section with PDF Button -->
    <div id="studentSection">
        <div class="pdf-download-wrapper">
            <button id="downloadPDF" class="btn btn-danger">
                <i class="fas fa-file-pdf me-2"></i>Download PDF
            </button>
        </div>
        
        <h2 class="mb-4">
            <i class="fas fa-users me-2"></i>Student Hall Tickets
        </h2>
        <div id="hallTicketsDisplay" class="row"></div>
    </div>
</div>

<!-- Hall Ticket Modal -->
<div class="modal fade" id="hallTicketModal" tabindex="-1" aria-labelledby="hallTicketModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="hallTicketModalLabel">
                    <i class="fas fa-ticket-alt me-2"></i>Previously Generated Hall Ticket
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                <form id="hallTicketForm" method="get" action="{% url 'previously_generated_hallticket' %}">
                    {% csrf_token %}
                    
                    <!-- Programme of Study -->
                    <div class="row mb-4">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="programStudyId" class="form-label">
                                <i class="fas fa-graduation-cap me-2"></i>Programme of Study
                            </label>
                            <select id="programStudyId" name="programme_of_study" class="form-select" required>
                                <option value="">-- Select --</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="deptId" class="form-label">
                                <i class="fas fa-building me-2"></i>Department
                            </label>
                            <select id="deptId" name="department" class="form-select" required>
                                <option value="">-- Select --</option>
                            </select>
                        </div>
                    </div>

                    <!-- Program & Intake -->
                    <div class="row mb-4">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="programId" class="form-label">
                                <i class="fas fa-book me-2"></i>Program
                            </label>
                            <select id="programId" name="program" class="form-select" required>
                                <option value="">-- Select --</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="intake" class="form-label">
                                <i class="fas fa-users me-2"></i>Intake
                            </label>
                            <select id="intake" name="intake" class="form-select">
                                <option value="">-- Select --</option>
                            </select>
                        </div>
                    </div>

                    <!-- Batch & Semester -->
                    <div class="row mb-4">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="batch" class="form-label">
                                <i class="fas fa-calendar me-2"></i>Batch
                            </label>
                            <select id="batch" name="batch" class="form-select">
                                <option value="">-- Select --</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="semester" class="form-label">
                                <i class="fas fa-calendar-alt me-2"></i>Semester
                            </label>
                            <select id="semester" name="semester" class="form-select">
                                <option value="">-- Select --</option>
                            </select>
                        </div>
                    </div>

                    <!-- Created Dates -->
                    <div class="row mb-4">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="created" class="form-label">
                                <i class="fas fa-calendar-day me-2"></i>Created On
                            </label>
                            <select id="created" name="created" class="form-select">
                                <option value="">-- Select --</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                            <i class="fas fa-times me-2"></i>Cancel
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-check me-2"></i>Load Halltickets
                        </button>
                    </div>
                </form>

                <div id="resultMessage" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>

<!-- JQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    $(document).ready(function () {
    
        $('#hallTicketModal').on('shown.bs.modal', function () {
            $('#programStudyId').html('<option value="">Loading...</option>');
            $.getJSON("{% url 'previous_hall_get_programmes_of_study' %}", function (data) {
                $('#programStudyId').html('<option value="">-- Select --</option>');
                $.each(data.programmes, function (i, item) {
                    $('#programStudyId').append('<option value="' + item + '">' + item + '</option>');
                });
            });
            resetDropdowns(['#deptId','#programId','#intake','#batch','#semester','#created']);
            $('#resultMessage').html('');
            $('#hallTicketsDisplay').empty();
            $('#studentSection').hide();
            $('#downloadPDF').hide();
        });
    
        $('#programStudyId').change(function () {
            let programme = $(this).val();
            resetDropdowns(['#deptId','#programId','#intake','#batch','#semester','#created']);
            if (!programme) return;
            $('#deptId').html('<option value="">Loading...</option>');
            $.getJSON("{% url 'previous_hall_get_departments' %}", { programme_of_study: programme }, function (data) {
                $('#deptId').html('<option value="">-- Select --</option>');
                $.each(data.departments, function (i, item) {
                    $('#deptId').append('<option value="' + item + '">' + item + '</option>');
                });
            });
        });
    
        $('#deptId').change(function () {
            let programme = $('#programStudyId').val();
            let department = $(this).val();
            resetDropdowns(['#programId','#intake','#batch','#semester','#created']);
            if (!department) return;
            $('#programId').html('<option value="">Loading...</option>');
            $.getJSON("{% url 'previous_hall_get_programs' %}", { 
                programme_of_study: programme, 
                department_name: department 
            }, function (data) {
                $('#programId').html('<option value="">-- Select --</option>');
                $.each(data.programs, function (i, item) {
                    $('#programId').append('<option value="' + item + '">' + item + '</option>');
                });
            });
        });
    
        $('#programId').change(function () {
            let programme = $('#programStudyId').val();
            let department = $('#deptId').val();
            let program = $(this).val();
            resetDropdowns(['#intake','#batch','#semester','#created']);
            if (!program) return;
            $('#intake').html('<option value="">Loading...</option>');
            $.getJSON("{% url 'previous_hall_get_intakes' %}", { 
                programme_of_study: programme, 
                department_name: department, 
                program_name: program 
            }, function (data) {
                $('#intake').html('<option value="">-- Select --</option>');
                $.each(data.intakes, function (i, item) {
                    $('#intake').append('<option value="' + item + '">' + item + '</option>');
                });
            });
        });
    
        $('#intake').change(function () {
            let programme = $('#programStudyId').val();
            let department = $('#deptId').val();
            let program = $('#programId').val();
            let intake = $(this).val();
            resetDropdowns(['#batch','#semester','#created']);
            if (!intake) return;
            $('#batch').html('<option value="">Loading...</option>');
            $.getJSON("{% url 'previous_hall_get_batches' %}", { 
                programme_of_study: programme, 
                department_name: department, 
                program_name: program, 
                Intake: intake 
            }, function (data) {
                $('#batch').html('<option value="">-- Select --</option>');
                $.each(data.batches, function (i, item) {
                    $('#batch').append('<option value="' + item + '">' + item + '</option>');
                });
            });
        });
    
        $('#batch').change(function () {
            let programme = $('#programStudyId').val();
            let department = $('#deptId').val();
            let program = $('#programId').val();
            let intake = $('#intake').val();
            let batch = $(this).val();
            resetDropdowns(['#semester','#created']);
            if (!batch) return;
            $('#semester').html('<option value="">Loading...</option>');
            $.getJSON("{% url 'previous_hall_get_semesters' %}", { 
                programme_of_study: programme, 
                department_name: department, 
                program_name: program, 
                Intake: intake, 
                batch: batch 
            }, function (data) {
                $('#semester').html('<option value="">-- Select --</option>');
                $.each(data.semesters, function (i, item) {
                    $('#semester').append('<option value="' + item + '">' + item + '</option>');
                });
            });
        });
    
        $('#semester').change(function () {
            let programme = $('#programStudyId').val();
            let department = $('#deptId').val();
            let program = $('#programId').val();
            let intake = $('#intake').val();
            let batch = $('#batch').val();
            let semester = $(this).val();
            resetDropdowns(['#created']);
            if (!semester) return;
            $('#created').html('<option value="">Loading...</option>');
            $.getJSON("{% url 'previous_hall_get_created_dates' %}", { 
                programme_of_study: programme, 
                department_name: department, 
                program_name: program, 
                Intake: intake, 
                batch: batch, 
                semester: semester 
            }, function (data) {
                $('#created').html('<option value="">-- Select --</option>');
                $.each(data.created_dates, function (i, item) {
                    $('#created').append('<option value="' + item + '">' + item + '</option>');
                });
            });
        });
    
        function resetDropdowns(ids) {
            ids.forEach(id => $(id).html('<option value="">-- Select --</option>'));
        }
    
        $('#hallTicketForm').submit(function(event) {
            event.preventDefault();
            const formData = $(this).serialize();
            $('#resultMessage').html('');
            $('#hallTicketsDisplay').empty();
            $('#studentSection').hide();
            $('#downloadPDF').hide();
    
            $.ajax({
                url: "{% url 'previously_generated_hallticket' %}",
                data: formData,
                method: 'GET',
                dataType: 'json',
                success: function(response) {
                    if (response.success) {
                        displayHallTickets(response.hall_tickets);
                        $('#studentSection').show();
                        $('#downloadPDF').show();
    
                        // Close modal and remove backdrop
                        $('.modal-backdrop').remove();
                        $('body').removeClass('modal-open').css('overflow', 'auto');
                        $('#hallTicketModal').modal('hide');
    
                        // Optional: scroll to student section
                        $('html, body').animate({
                            scrollTop: $('#studentSection').offset().top - 20
                        }, 500);
    
                    } else {
                        $('#resultMessage').html('<div class="alert alert-warning">' + response.message + '</div>');
                    }
                },
                error: function() {
                    $('#resultMessage').html('<div class="alert alert-danger">Error loading hall tickets. Please try again.</div>');
                }
            });
        });
    
        function displayHallTickets(hallTickets) {
            let html = '';
            hallTickets.forEach(function(ht) {
                html += `
                    <div class="col-12 mb-4">
                        <div class="student-card">
                            <div class="row">
                                <div class="col-md-10">
                                    <div class="student-header">
                                        <h4 class="mb-2">
                                            <i class="fas fa-user-graduate me-2"></i>${ht.name}
                                            <small class="text-muted">(${ht.register_number})</small>
                                        </h4>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <p class="mb-2"><strong><i class="fas fa-calendar-alt me-2"></i>Semester:</strong> ${ht.current_semester}</p>
                                            <p class="mb-2"><strong><i class="fas fa-users me-2"></i>Intake-Batch:</strong> ${ht.Intake} - ${ht.batch}</p>
                                            <p class="mb-2"><strong><i class="fas fa-birthday-cake me-2"></i>DOB:</strong> ${ht.date_of_birth}</p>
                                        </div>
                                        <div class="col-md-6">
                                            <p class="mb-2"><strong><i class="fas fa-graduation-cap me-2"></i>Programme:</strong> ${ht.programme_of_study}</p>
                                            <p class="mb-2"><strong><i class="fas fa-book me-2"></i>Program:</strong> ${ht.program_name}</p>
                                            <p class="mb-2"><strong><i class="fas fa-building me-2"></i>Department:</strong> ${ht.department_name}</p>
                                        </div>
                                    </div>
                                    <hr>
                                    <h5 class="mb-3"><i class="fas fa-book-open me-2"></i>Registered Courses</h5>
                                    <div class="table-responsive">
                                        <table class="table course-table">
                                            <thead>
                                                <tr>
                                                    <th><i class="fas fa-hashtag me-2"></i>Code</th>
                                                    <th><i class="fas fa-book me-2"></i>Title</th>
                                                    <th><i class="fas fa-calendar me-2"></i>Semester</th>
                                                    <th><i class="fas fa-clock me-2"></i>Session</th>
                                                    <th><i class="fas fa-calendar-day me-2"></i>Date</th>
                                                </tr>
                                            </thead>
                                            <tbody>`;
                ht.courses.forEach(function(course) {
                    html += `
                                                <tr>
                                                    <td>${course.course_code}</td>
                                                    <td>${course.course_title}</td>
                                                    <td>${course.semester}</td>
                                                    <td>${course.session}</td>
                                                    <td>${course.date}</td>
                                                </tr>`;
                });
                html += `
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                <div class="col-md-2 student-photo-container">
                                    ${ht.photo_url ? `<img src="${ht.photo_url}" alt="Student Photo" 
                                         class="img-fluid student-photo"
                                         style="width: 100%; max-width: 150px; height: auto;">` : ''}
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
            $('#hallTicketsDisplay').html(html);
        }
    
        $('#downloadPDF').click(function () {
            const formData = $('#hallTicketForm').serialize();
            const url = `{% url 'previously_generated_hallticket_pdf' %}?` + formData;
            window.open(url, '_blank');
        });
    
    });
</script>
{% endblock %}
