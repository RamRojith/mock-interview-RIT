{% extends "base.html" %}
{% load static %}
{% block content %}

<div class="container-fluid py-4" style="max-width:1400px;">
  <div class="card shadow rounded-4 border-0">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center"
         style="border-radius: 1rem 1rem 0 0;">
      <h4 class="mb-0">
        <i class="fas fa-list-check me-2"></i>
        Internal Exam Schedule Generation
      </h4>
    </div>

    <div class="card-body p-4">

      <!-- ✅ FORM -->
      <form method="post" action="{% url 'internal_exam_schedule' %}" id="degreeDeptForm">
        {% csrf_token %}

        <div class="row g-3">

          <!-- ✅ DEGREE -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Degree</label>
            <select id="degree" name="degree" class="form-select" required>
              <option value="" selected disabled>Select Degree</option>
              {% for d in degrees %}
<option value="{{ d.ids }}">
  {{ d.name }}
</option>
{% endfor %}

            </select>
          </div>

          <!-- ✅ DEPARTMENT (Dynamic) -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Department</label>
            <select id="department" name="department" class="form-select" required disabled>
              <option value="" selected disabled>Select Department</option>
            </select>
          </div>

          <!-- ✅ REGULATION -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Regulation</label>
            <select id="regulation" name="regulation" class="form-select" required>
              <option value="" disabled {% if not selected_regulation %}selected{% endif %}>
                Select Regulation
              </option>
              {% for r in regulations %}
                <option value="{{ r.id }}" {% if selected_regulation == r.id|stringformat:"s" %}selected{% endif %}>
                  {{ r }}
                </option>
              {% endfor %}
            </select>
          </div>

          <!-- ✅ INTERNAL ASSESSMENT (Dynamic by Degree) -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Internal Assessment</label>
            <select id="internal_assessment" name="internal_assessment" class="form-select" required disabled>
              <option value="" selected disabled>Select Internal Assessment</option>
            </select>
          </div>

          <!-- ✅ DATE FIELD -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Schedule Date</label>
            <input type="date" id="schedule_date" name="schedule_date" class="form-control" required>
          </div>

        </div>

        <div class="mt-4 d-flex gap-2 flex-wrap">
          <button type="submit" class="btn btn-success">
            <i class="fas fa-bolt me-1"></i> Generate
          </button>

          <button type="reset" class="btn btn-outline-secondary" id="resetBtn">
            <i class="fas fa-rotate-left me-1"></i> Reset
          </button>

          <a href="{% url 'view_internal_exam_schedule' %}" class="btn btn-primary">
            <i class="fas fa-eye me-1"></i> View Scheduled
          </a>
          <a href="{% url 'published_internal_exam_schedule' %}" class="btn btn-warning">
            <i class="fas fa-upload me-1"></i> View Published Schedule
          </a>
        </div>

      </form>

    </div>
  </div>
</div>

<!-- ✅ jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(function () {

  // -----------------------
  // Department helpers
  // -----------------------
  function setDeptLoading() {
    $("#department").prop("disabled", true)
      .html(`<option value="" selected disabled>Loading...</option>`);
  }

  function setDeptPlaceholder(msg) {
    $("#department").prop("disabled", true)
      .html(`<option value="" selected disabled>${msg}</option>`);
  }

  function setDeptOptions(items) {
    let opts = `<option value="" selected disabled>Select Department</option>`;
    (items || []).forEach(d => {
      opts += `<option value="${d.id}">${d.text}</option>`;
    });

    const hasItems = items && items.length > 0;
    $("#department").prop("disabled", !hasItems).html(opts);

    if (!hasItems) setDeptPlaceholder("No departments found");
  }

  // -----------------------
  // Internal Assessment helpers
  // -----------------------
  function setIatLoading() {
    $("#internal_assessment").prop("disabled", true)
      .html(`<option value="" selected disabled>Loading...</option>`);
  }

  function setIatPlaceholder(msg) {
    $("#internal_assessment").prop("disabled", true)
      .html(`<option value="" selected disabled>${msg}</option>`);
  }

  function setIatOptions(items) {
    let opts = `<option value="" selected disabled>Select Internal Assessment</option>`;
    (items || []).forEach(x => {
      opts += `<option value="${x.id}">${x.text}</option>`;
    });

    const hasItems = items && items.length > 0;
    $("#internal_assessment").prop("disabled", !hasItems).html(opts);

    if (!hasItems) setIatPlaceholder("No assessments found");
  }

  // -----------------------
  // Degree change -> load Department + IAT
  // -----------------------
  $("#degree").on("change", function () {
    const degreeId = $(this).val();

    if (!degreeId) {
      setDeptPlaceholder("Select Degree first");
      setIatPlaceholder("Select Degree first");
      return;
    }

    // ✅ Load Departments
    setDeptLoading();
    $.get("{% url 'departments_by_degree' %}", { degree_id: degreeId }, function (res) {
      setDeptOptions(res.items || []);
    }).fail(function () {
      setDeptPlaceholder("Error loading departments");
    });

    // ✅ Load Internal Assessments (IAT)
    setIatLoading();
    $.get("{% url 'internal_assessments_by_degree' %}", { degree_id: degreeId }, function (res) {
      setIatOptions(res.items || []);
    }).fail(function () {
      setIatPlaceholder("Error loading assessments");
    });
  });

  // -----------------------
  // Reset
  // -----------------------
  $("#resetBtn").on("click", function () {
    setDeptPlaceholder("Select Degree first");
    setIatPlaceholder("Select Degree first");
    $("#regulation").val("");
    $("#schedule_date").val("");
  });

  // init placeholders
  setDeptPlaceholder("Select Degree first");
  setIatPlaceholder("Select Degree first");

});
</script>

<style>
  select.form-select, input.form-control { text-align: left; }
</style>

{% endblock %}
