{% extends 'base.html' %}
{% block content %}
<div class="container-fluid py-4">
    <div class="card shadow-sm mx-auto" style="max-width: 700px;">
        <div class="card-header bg-white border-bottom-0 py-3">
            <div class="d-flex justify-content-between align-items-center">
                <h2 class="h5 mb-0">
                    <i class="fas fa-edit text-primary me-2"></i>Edit Assessment
                </h2>
                <a href="{% url 'assessments_list' %}" class="btn btn-sm btn-outline-secondary">
                    <i class="fas fa-arrow-left me-1"></i> Back to List
                </a>
            </div>
        </div>

        <div class="card-body">
            <form method="POST" class="needs-validation" novalidate>
                {% csrf_token %}

                <!-- Degree -->
                <div class="mb-4">
                    <label for="degree" class="form-label fw-semibold">
                        <i class="fas fa-graduation-cap me-2 text-muted"></i>Degree
                    </label>
                    <select name="degree" id="degree" class="form-select" required>
                        <option value="" disabled {% if not assessment.degree %}selected{% endif %}>Select Programme</option>
                        <option value="B.E" {% if assessment.degree == "B.E" %}selected{% endif %}>B.E (Bachelor of Engineering)</option>
                        <option value="B.TECH" {% if assessment.degree == "B.TECH" %}selected{% endif %}>B.TECH (Bachelor of Technology)</option>
                    </select>
                    <div class="invalid-feedback">Please select a degree.</div>
                </div>

                <!-- Assessment Name -->
                <div class="mb-4">
                    <label for="assessment_name" class="form-label fw-semibold">
                        <i class="fas fa-file-alt me-2 text-muted"></i>Assessment Name
                    </label>
                    <input type="text" name="assessment_name" id="assessment_name" class="form-control" 
                           value="{{ assessment.assessment_name }}" placeholder="Enter assessment name" required>
                    <div class="invalid-feedback">Please provide an assessment name.</div>
                </div>

                <!-- Max Marks -->
                {% comment %} <div class="mb-4">
                    <label for="max_marks" class="form-label fw-semibold">
                        <i class="fas fa-percentage me-2 text-muted"></i>Max Marks
                    </label>
                    <input type="number" name="max_marks" id="max_marks" class="form-control" 
                           value="{{ assessment.max_marks }}" placeholder="Enter maximum marks" required>
                    <div class="invalid-feedback">Please provide max marks.</div>
                </div> {% endcomment %}

                <!-- Form Actions -->
                <div class="d-flex justify-content-end mt-4 pt-3 border-top">
                    <a href="{% url 'assessments_list' %}" class="btn btn-outline-secondary me-3">
                        <i class="fas fa-times me-1"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save me-1"></i> Update Assessment
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

{% block extra_js %}
<script>
// Bootstrap form validation
(function () {
    'use strict'
    var forms = document.querySelectorAll('.needs-validation')
    Array.prototype.slice.call(forms).forEach(function (form) {
        form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
            }
            form.classList.add('was-validated')
        }, false)
    })
})();
</script>
{% endblock %}
{% endblock %}
