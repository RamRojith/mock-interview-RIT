{% extends "base.html" %}
{% block content %}

<h3>Course Grades</h3>

<button class="btn btn-primary mb-3" onclick="openModal()">Add Course Grade</button>

<table class="table table-bordered">
    <tr>
        <th>Letter</th>
        <th>Description</th>
        <th>Points</th>
        <th>Action</th>
    </tr>

    {% for g in grades %}
    <tr>
        <td>{{g.letter_grade}}</td>
        <td>{{g.description}}</td>
        <td>{{g.grade_points}}</td>
        <td>
            <button class="btn btn-sm btn-info"
              onclick="editGrade('{{g.id}}','{{g.letter_grade}}','{{g.description}}','{{g.grade_points}}')">
              Edit
            </button>

            <form method="post" style="display:inline;">
                {% csrf_token %}
                <input type="hidden" name="action" value="delete">
                <input type="hidden" name="grade_id" value="{{g.id}}">
                <button class="btn btn-sm btn-danger"
                 onclick="return confirm('Delete this grade?')">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>


<!-- Modal -->
<div class="modal fade" id="gradeModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="action" value="save">
        <input type="hidden" name="grade_id" id="grade_id">

        <div class="modal-header">
          <h5 class="modal-title">Course Grade</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <label>Letter Grade</label>
          <input type="text" name="letter_grade" id="letter_grade" class="form-control" required>

          <label>Description</label>
          <input type="text" name="description" id="description" class="form-control">

          <label>Grade Points</label>
          <input type="number" step="0.01" name="grade_points" id="grade_points" class="form-control" required>

        </div>

        <div class="modal-footer">
          <button class="btn btn-success">Save</button>
        </div>

      </form>
    </div>
  </div>
</div>


<script>
function openModal(){
    document.getElementById("grade_id").value="";
    document.getElementById("letter_grade").value="";
    document.getElementById("description").value="";
    document.getElementById("grade_points").value="";
    new bootstrap.Modal(document.getElementById('gradeModal')).show();
}

function editGrade(id, letter, desc, points){
    document.getElementById("grade_id").value=id;
    document.getElementById("letter_grade").value=letter;
    document.getElementById("description").value=desc;
    document.getElementById("grade_points").value=points;
    new bootstrap.Modal(document.getElementById('gradeModal')).show();
}
</script>

{% endblock %}
