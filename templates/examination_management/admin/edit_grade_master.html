{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header bg-light">
                    <div class="d-flex justify-content-between align-items-center">
                        <h4 class="mb-0">Edit Grade</h4>
                        <a href="" class="btn btn-sm btn-outline-secondary">
                            <i class="fas fa-arrow-left me-1"></i> Back
                        </a>
                    </div>
                </div>

                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}

                        <!-- Department -->
                        

                        <!-- Degree -->
                        <div class="mb-3">
                            <label class="form-label">Programme</label>
                            <select name="degree" id="degree" class="form-select" required>
                                <option value="" disabled {% if not grade.degree %}selected{% endif %}>Select Programme</option>
                                <option value="B.E" {% if grade.degree == "B.E" %}selected{% endif %}>B.E (Bachelor of Engineering)</option>
                                <option value="B.TECH" {% if grade.degree == "B.TECH" %}selected{% endif %}>B.TECH (Bachelor of Technology)</option>
                            </select>
                        </div>

                        <!-- Regulation -->
                        <div class="mb-3">
                            <label class="form-label">Regulation</label>
                            <input type="text" class="form-control" name="regulation" 
                                   value="{{ grade.regulation }}" required>
                        </div>

                        <!-- Mark Range -->
                        <div class="row mb-3">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Mark From</label>
                                <input type="number" class="form-control" name="mark_from" 
                                       value="{{ grade.mark_from }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Mark To</label>
                                <input type="number" class="form-control" name="mark_to" 
                                       value="{{ grade.mark_to }}" required>
                            </div>
                        </div>

                        <!-- Grade -->
                        <div class="mb-3">
                            <label class="form-label">Grade</label>
                            <input type="text" class="form-control" name="grade" 
                                   value="{{ grade.grade }}" required>
                        </div>

                        <!-- Grade Points -->
                        <div class="row mb-3">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Grade From</label>
                                <input type="number" step="0.01" class="form-control" 
                                       name="grade_from" value="{{ grade.grade_from }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Grade To</label>
                                <input type="number" step="0.01" class="form-control" 
                                       name="grade_to" value="{{ grade.grade_to }}" required>
                            </div>
                        </div>

                        <!-- Class Category -->
                        <div class="mb-4">
                            <label class="form-label">Class Category</label>
                            <select name="class_category" id="class_category" class="form-select" required>
                                <option value="" disabled {% if not grade.class_category %}selected{% endif %}>Select Class Category</option>
                                <option value="Distinction" {% if grade.class_category == "Distinction" %}selected{% endif %}>Distinction</option>
                                <option value="Upper First Class" {% if grade.class_category == "Upper First Class" %}selected{% endif %}>Upper First Class</option>
                                <option value="Lower First Class" {% if grade.class_category == "Lower First Class" %}selected{% endif %}>Lower First Class</option>
                                <option value="Upper Second Class" {% if grade.class_category == "Upper Second Class" %}selected{% endif %}>Upper Second Class</option>
                                <option value="Lower Second Class" {% if grade.class_category == "Lower Second Class" %}selected{% endif %}>Lower Second Class</option>
                                <option value="Pass" {% if grade.class_category == "Pass" %}selected{% endif %}>Pass</option>
                                <option value="Failure" {% if grade.class_category == "Failure" %}selected{% endif %}>Failure</option>
                            </select>
                        </div>

                        <!-- Form Actions -->
                        <div class="d-flex justify-content-end mt-4 pt-3 border-top">
                            <a href="" class="btn btn-outline-secondary me-2">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> Update Grade
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
