{% extends "base.html" %}
{% load static %}
{% block content %}
<style>
    .transfer-wrap { padding: 1rem 2rem; max-width: 900px; margin: 0 auto; }
    .form-card {
        background: #fff;
        border-radius: 16px;
        padding: 1.75rem;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        border-left: 4px solid #1a4b8c;
    }
    .form-title { font-size: 1.6rem; font-weight: 700; color: #1a4b8c; margin-bottom: 1.5rem; }
    .form-label { font-weight: 600; color: #374151; font-size: 0.9rem; }
    .form-control, .form-select { border-radius: 8px; }
    .form-control:focus, .form-select:focus {
        border-color: #1a4b8c;
        box-shadow: 0 0 0 0.2rem rgba(26,75,140,0.25);
    }
</style>

<div class="transfer-wrap">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    <div class="form-card">
        <h2 class="form-title"><i class="fas fa-right-left me-2"></i>New Transfer Request</h2>

        <form method="post" action="{% url 'transfer_create' %}">
            {% csrf_token %}

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">From Lab (Source) <span class="text-danger">*</span></label>
                    <select name="from_lab" class="form-select" required>
                        <option value="">-- Select source lab --</option>
                        {% for lab in from_labs %}
                        <option value="{{ lab.id }}" {% if form_data.from_lab == lab.id|stringformat:"s" %}selected{% endif %}>
                            {{ lab.lab_code }} - {{ lab.name }} ({{ lab.department }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">To Lab (Destination) <span class="text-danger">*</span></label>
                    <select name="to_lab" class="form-select" required>
                        <option value="">-- Select destination lab --</option>
                        {% for lab in to_labs %}
                        <option value="{{ lab.id }}" {% if form_data.to_lab == lab.id|stringformat:"s" %}selected{% endif %}>
                            {{ lab.lab_code }} - {{ lab.name }} ({{ lab.department }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Reason for Transfer <span class="text-danger">*</span></label>
                <textarea name="reason" class="form-control" rows="4"
                          placeholder="Explain why these assets are being transferred (minimum 20 characters)."
                          required minlength="20">{{ form_data.reason|default:'' }}</textarea>
                <small class="text-muted">Minimum 20 characters.</small>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i>Save as Draft
                </button>
                <a href="{% url 'transfer' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
