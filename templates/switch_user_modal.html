<!-- Switch User Modal -->
{% load static %}
{% load user_tags %}
<div class="modal fade" id="switchUserModal" tabindex="-1" aria-labelledby="switchUserModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="switchUserModalLabel">Switch User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Form for switching users -->
                    <form id="switchUserForm" action="{% url 'switch_user' %}" method="POST">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="user" class="form-label">Select User</label>
                            <select name="unique_id" id="switchuser_id" class="form-control" required>
                                {% switch_user_data request.user.Employee_id as sudata %}
                                {% for user in sudata %}
                                    <option value="{{ user.unique_id }}" {% if request.user.unique_id == user.unique_id %}selected{% endif %}>{{ user.username }}-{{user.role.role}}-{{user.Department.Department_code}}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary mt-3" id="switch_button"><i class="fa fa-arrow-right-arrow-left"></i> Switch</button>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>

        
    </div>
