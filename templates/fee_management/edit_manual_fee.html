{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Edit Manual Fee Payment</h4>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Student Name</label>
                        <input type="text" class="form-control" value="{{ fee.student_name }}" readonly>
                        <input type="hidden" name="student_name" value="{{ fee.student_name }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">NRC Number</label>
                        <input type="text" class="form-control" value="{{ fee.nrc_number }}" readonly>
                        <input type="hidden" name="nrc_number" value="{{ fee.nrc_number }}">
                    </div>
                </div>
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Programme of Study</label>
                        <input type="text" class="form-control" value="{{ fee.programme_of_study }}" readonly>
                        <input type="hidden" name="programme_of_study" value="{{ fee.programme_of_study }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Program</label>
                        <input type="text" class="form-control" value="{{ fee.program }}" readonly>
                        <input type="hidden" name="program" value="{{ fee.program }}">
                    </div>
                </div>
                
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Amount Paid (ZMW)</label>
                        <div class="input-group">
                            <span class="input-group-text">ZMW</span>
                            <input type="number" step="0.01" class="form-control" 
                                   name="amount_paid" value="{{ fee.amount_paid }}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Reference Number</label>
                        <input type="text" class="form-control" name="reference_number" 
                               value="{{ fee.reference_number|default:'' }}">
                    </div>
                </div>
                
                <div class="d-flex justify-content-between">
                    <a href="{% url 'manual_fee_history' %}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left me-2"></i>Cancel
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-2"></i>Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
