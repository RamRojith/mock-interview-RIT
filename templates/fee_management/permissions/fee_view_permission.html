{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

    <h4 class="mb-3">Fee View Permissions</h4>

    {% comment %} {% if messages %}
      {% for m in messages %}
        <div class="alert alert-{{ m.tags }} mb-3">{{ m }}</div>
      {% endfor %}
    {% endif %} {% endcomment %}

    <!-- FORM -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form method="post" class="row g-3">
                {% csrf_token %}
                <input type="hidden" name="action" value="save">

                <!-- ROLE SEARCH -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Roles</label>

                    <input type="text"
                           id="roleSearch"
                           class="form-control form-control-sm mb-2"
                           placeholder="Search roles..."
                           onkeyup="filterRoles()">

                    <select name="roles[]" id="roleSelect"
                            class="form-select" multiple required size="7">
                        {% for role in roles %}
                            <option value="{{ role.id }}">{{ role.role }}</option>
                        {% endfor %}
                    </select>

                    <small class="text-muted">
                        Hold <kbd>Ctrl</kbd> / <kbd>Cmd</kbd> to select multiple
                    </small>
                </div>

                <!-- PERMISSIONS -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold d-block mb-2">Permissions</label>

                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox"
                               name="can_view_all_fee" id="viewAllFee">
                        <label class="form-check-label" for="viewAllFee">
                            View All Fee
                        </label>
                    </div>

                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox"
                               name="can_view_department_fee" id="viewDeptFee">
                        <label class="form-check-label" for="viewDeptFee">
                            View Department Fee
                        </label>
                    </div>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SEARCH PERMISSIONS -->
    <div class="row mb-3">
        <div class="col-md-4">
            <input type="text" id="searchInput" class="form-control"
                   placeholder="Search permission by role">
        </div>
        <div class="col-md-auto">
            <button class="btn btn-primary" onclick="loadPermissions(1)">Search</button>
            <button class="btn btn-outline-secondary" onclick="clearSearch()">Clear</button>
        </div>
    </div>

    <!-- TABLE -->
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Role</th>
                    <th>All</th>
                    <th>Dept</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="permissionBody">
                    <tr><td colspan="5" class="text-center">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="pagination" class="mt-3"></div>

</div>

<script>
/* ---------------- ROLE SEARCH (JS ONLY) ---------------- */
let allRoleOptions = [];

document.addEventListener("DOMContentLoaded", () => {
    const select = document.getElementById("roleSelect");
    allRoleOptions = Array.from(select.options).map(o => ({
        value: o.value,
        text: o.text
    }));
});

function filterRoles() {
    const search = document.getElementById("roleSearch").value.toLowerCase();
    const select = document.getElementById("roleSelect");

    const selected = Array.from(select.selectedOptions).map(o => o.value);
    select.innerHTML = "";

    allRoleOptions.forEach(role => {
        if (role.text.toLowerCase().includes(search)) {
            const opt = document.createElement("option");
            opt.value = role.value;
            opt.text = role.text;
            if (selected.includes(role.value)) opt.selected = true;
            select.appendChild(opt);
        }
    });
}

/* ---------------- PERMISSION LIST (AJAX) ---------------- */
function loadPermissions(page = 1) {
    const search = document.getElementById("searchInput").value;

    fetch(`{% url 'fee_view_permission_api' %}?page=${page}&search=${encodeURIComponent(search)}`)
        .then(res => res.json())
        .then(data => {
            const body = document.getElementById("permissionBody");
            body.innerHTML = "";

            if (!data.results.length) {
                body.innerHTML = `<tr><td colspan="5" class="text-center">No results</td></tr>`;
                return;
            }

            data.results.forEach((p, i) => {
                body.innerHTML += `
                <tr>
                    <td>${i + 1}</td>
                    <td>${p.role}</td>
                    <td><span class="badge ${p.can_view_all ? 'bg-success':'bg-secondary'}">${p.can_view_all ? 'Yes':'No'}</span></td>
                    <td><span class="badge ${p.can_view_dept ? 'bg-success':'bg-secondary'}">${p.can_view_dept ? 'Yes':'No'}</span></td>
                    <td>
                        <form method="post" class="d-inline">
                            {% csrf_token %}
                            <input type="hidden" name="action" value="delete">
                            <input type="hidden" name="perm_id" value="${p.id}">
                            <button class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('Delete?')">Delete</button>
                        </form>
                    </td>
                </tr>`;
            });

            renderPagination(data);
        });
}

function renderPagination(data) {
    const p = document.getElementById("pagination");
    p.innerHTML = "";

    if (data.has_prev)
        p.innerHTML += `<button class="btn btn-outline-secondary me-2" onclick="loadPermissions(${data.page - 1})">Prev</button>`;

    p.innerHTML += `Page ${data.page} of ${data.total_pages}`;

    if (data.has_next)
        p.innerHTML += `<button class="btn btn-outline-secondary ms-2" onclick="loadPermissions(${data.page + 1})">Next</button>`;
}

function clearSearch() {
    document.getElementById("searchInput").value = "";
    loadPermissions(1);
}

loadPermissions();
</script>

{% endblock %}
