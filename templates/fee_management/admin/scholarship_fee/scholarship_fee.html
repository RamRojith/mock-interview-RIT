{% extends "base.html" %}
{% load static %}
<link rel="stylesheet" href="{% static 'admin_dashboard_css.css' %}" />

{% block content %}
<div class="container-fluid py-4">
    <div style="border-bottom: 2px solid #000; padding-bottom: 8px;">
        <h2>Scholarship Fees</h2>
    </div>

    <!-- Row of Cards with Space Around -->
    <div class="row mt-4">
        <div class="d-flex flex-wrap justify-content-around w-100 gap-4">

            <!-- Scholarship Deduction Card -->
            <div>
                <a data-bs-toggle="modal" data-bs-target="#DeductScholarshipModal" class="text-decoration-none">
                    <div class="card shadow-sm border-0 text-center hover-scale d-flex align-items-center justify-content-center"
                        style="background: linear-gradient(135deg, #004e64, #028090); border: none; height: 100px; width: 150px;">
                        <div class="card-body text-warning">
                            <i class="fa-solid fa-user-graduate" style="font-size: 2rem; color: #fff;"></i>
                            <h6 class="mt-2 text-white">Add Scholarship Fee</h6>
                        </div>
                    </div>
                </a>
                {% include 'fee_management/admin/scholarship_fee/add_scholarship_fee.html' %}
            </div>

            <!-- Edit / Update Fee Card -->
            <div>
                <button onclick="window.location.href='{% url 'view_scholarship_fee' %}'"
                    class="card shadow-sm border-0 text-center hover-scale d-flex align-items-center justify-content-center"
                    style="background: linear-gradient(135deg, rgb(30, 114, 34), rgb(42, 152, 141)); border: none; height: 100px; width: 150px;">
                    <div class="card-body">
                        <i class="fa-solid fa-pen-to-square" style="font-size: 2rem; color: #fff;"></i>
                        <h6 class="mt-2 text-white">Edit Scholarship Fee</h6>
                    </div>
                </button>
            </div>

        </div>
    </div>
</div>
{% endblock content %}
