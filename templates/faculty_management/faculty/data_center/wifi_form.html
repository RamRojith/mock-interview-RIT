{% extends "base.html" %}
{% block content %}

<div class="container mt-5">
    <h3 class="text-center mb-4">WiFi Access Request</h3>

    <div class="row justify-content-center">

        <!-- Staff WiFi Card -->
        <div class="col-md-4">
            <div class="card shadow text-center p-4 hover-card"
                 onclick="location.href='{% url 'staff_wifi_form' %}'"
                 style="cursor:pointer;">
                
                <div class="card-body">
                    <h5 class="card-title">Staff WiFi Request</h5>
                    <p class="card-text">Apply for Staff Device WiFi Access</p>
                    <button class="btn btn-primary">Open</button>
                </div>
            </div>
        </div>

        <!-- Guest WiFi Card -->
        <div class="col-md-4">
            <div class="card shadow text-center p-4 hover-card"
                 onclick="location.href='{% url 'guest_wifi_form' %}'"
                 style="cursor:pointer;">
                
                <div class="card-body">
                    <h5 class="card-title">Guest WiFi Request</h5>
                    <p class="card-text">Apply for Guest WiFi Access</p>
                    <button class="btn btn-success">Open</button>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Small hover effect -->
<style>
.hover-card:hover {
    transform: scale(1.03);
    transition: 0.3s;
}
</style>

{% endblock %}
