{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="website icon" type="png" href="{% static 'images/ritlogo.png' %}">
</head>
<body class="bg-light">
    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="card shadow rounded-4 p-4" style="width: 100%; max-width: 400px;">
            <h3 class="text-center mb-4">Employee Login</h3>

            {% if form.errors %}
                <div class="alert alert-danger">
                    Invalid Employee ID or password.
                </div>
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="employee_id" class="form-label">Employee ID</label>
                    <input type="text" name="Employee_id" class="form-control" id="employee_id" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" id="password" required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>
            </form>

            
        </div>
    </div>
</body>
</html>
