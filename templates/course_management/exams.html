{% load static %}
 
<!-- Add Exam Modal -->
<!-- Add Exam Modal -->
<div class="modal fade" id="addExamModal" tabindex="-1" role="dialog" aria-labelledby="addExamModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title" id="addExamModalLabel">Add New Assessment</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="addExamForm" method="POST">
          {% csrf_token %}
          <div class="form-group">
            <label for="programme_of_study">Program of Study</label>
            <select name="programme_of_study" id="programme_of_study" class="form-select" required>
              <option value="" selected hidden>Select Programme</option> <!-- Changed 'disabled' to 'hidden' -->
              <option value="Certificate">Certificate</option>
              <option value="Diploma">Diploma</option>
              <option value="Advanced Diploma">Advanced Diploma</option>
              <option value="Bachelor Degree">Bachelor Degree</option>
              <option value="Postgraduate Diploma">Postgraduate Diploma</option>
              <option value="Master Degree">Master Degree</option>
          </select>
          </div>
        
          <div class="form-group">
            <label for="examName">Assessment Name</label>
            <input type="text" id="examName" name="exam_name" class="form-control" required>
          </div>
        
          <div class="form-group mt-3">
            <label for="examMark">Maximum Mark</label>
            <input type="number" id="examMark" name="mark_value" class="form-control" required>
          </div>
        
          <button type="submit" class="btn btn-primary mt-3">Add Assessment</button>
        </form>
        
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
<script>
  document.getElementById("addExamForm").addEventListener("submit", function (event) {
    event.preventDefault();

    var programmeDropdown = document.getElementById("programme_of_study");
    var programme = programmeDropdown.options[programmeDropdown.selectedIndex].value;
    var examName = document.getElementById("examName").value;
    var examMark = document.getElementById("examMark").value;
    var csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;

    console.log("Programme:", programme);
    console.log("Exam Name:", examName);
    console.log("Exam Mark:", examMark);

    if (!programme || !examName || !examMark) {
        alert("Please fill all fields.");
        return;
    }

    fetch("{% url 'add_exam' %}", {
        method: "POST",
        headers: {
            "X-CSRFToken": csrfToken,
            "Content-Type": "application/json",
        },
        body: JSON.stringify({
            programme_of_study: programme,  
            exams: examName,
            mark: examMark
        })
    })
    .then(response => response.json())
    .then(data => {
        console.log("Server Response:", data); // Debugging the response
        if (data.success) {
            alert("Assessment added successfully!");
            location.reload();
        } else {
            alert("Error: " + (data.error || "Unknown error"));
        }
    })
    .catch(error => console.error("Fetch Error:", error));
});


</script>
