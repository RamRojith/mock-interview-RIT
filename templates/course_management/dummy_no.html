{% extends "base.html" %}
 
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Dummy Numbers</title>
    
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            max-width: 700px;
        }

        .card {
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        .form-select {
            border-radius: 5px;
        }

        .btn {
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .btn-success:hover {
            background-color: #218838;
        }

        .table th, .table td {
            vertical-align: middle;
        }

        .table thead {
            background-color: #343a40;
            color: #ffffff;
        }

        .disabled-btn {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>

</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Generate Dummy Numbers</h2>

        <!-- Course Selection -->
        <!-- Department Select -->
        <label for="department" class="form-label fw-bold">Select Department:</label>
        <select id="department" class="form-select mb-3">
            <option value="">-- Select Department --</option>
            {% for dept in departments %}
                <option value="{{ dept.id }}">{{ dept.Department }}</option>
            {% endfor %}
        </select>

        <!-- Program Select -->
        <label for="program" class="form-label fw-bold">Select Program:</label>
        <select id="program" class="form-select mb-3" disabled>
            <option value="">-- Select Program --</option>
        </select>

        <!-- Semester Select -->
        <label for="semester" class="form-label fw-bold">Select Semester:</label>
        <select id="semester" class="form-select mb-3" disabled>
            <option value="">-- Select Semester --</option>
            {% for sem in semesters %}
                <option value="{{ sem }}">{{ sem }}</option>
            {% endfor %}
        </select>

        <!-- Course Code Select (Final) -->
        <label for="course_code" class="form-label fw-bold">Select Course:</label>
        <select id="course_code" class="form-select mb-3" disabled>
            <option value="">-- Select Course --</option>
        </select>

        <button id="generateBtn" class="btn btn-primary mt-3 w-100">Create Duplicate Numbers</button>


        <!-- Table for Displaying Generated Dummy Numbers -->
        <div class="card p-4 mt-4">
            <h5 class="text-center mb-3">Generated Dummy Numbers</h5>
            <div class="table-responsive">
                <table class="table table-bordered table-striped text-center">
                    <thead>
                        <tr>
                            <th>Student Reg No</th>
                            <th>Dummy Number</th>
                        </tr>
                    </thead>
                    <tbody id="dummyTableBody">
                        <!-- Generated dummy numbers will appear here -->
                    </tbody>
                </table>
            </div>
            <button id="submitBtn" class="btn btn-success w-100 mt-3 disabled-btn" disabled>Submit</button>
        </div>
    </div>

    <script>
        $(document).ready(function(){
            $("#generateBtn").click(function(){
                let courseCode = $("#course_code").val();
                if (!courseCode) {
                    alert("⚠️ Please select a course.");
                    return;
                }
    
                $.ajax({
                    url: "{% url 'generate_dummy_numbers' %}",
                    type: "POST",
                    data: { course_code: courseCode, csrfmiddlewaretoken: "{{ csrf_token }}" },
                    beforeSend: function() {
                        $("#generateBtn").text("Generating...").prop("disabled", true);
                    },
                    success: function(response) {
                        $("#dummyTableBody").empty();
                        response.data.forEach(row => {
                            $("#dummyTableBody").append(`<tr>
                                <td>${row.student_reg_no}</td>
                                <td>${row.dummy_no}</td>
                            </tr>`);
                        });
                        $("#submitBtn").removeClass("disabled-btn").prop("disabled", false);
                        $("#generateBtn").text("Create Duplicate Numbers").prop("disabled", false);
                    },
                    error: function() {
                        alert("❌ Error fetching dummy numbers.");
                        $("#generateBtn").text("Create Duplicate Numbers").prop("disabled", false);
                    }
                });
            });
    
            $("#submitBtn").click(function(){
                let courseCode = $("#course_code").val();
                let dummyNumbers = [];
        
                $("#dummyTableBody tr").each(function(){
                    let studentRegNo = $(this).find("td:eq(0)").text().trim();
                    let dummyNo = $(this).find("td:eq(1)").text().trim();
                    dummyNumbers.push({ student_reg_no: studentRegNo, dummy_no: dummyNo });
                });

                $.ajax({
                    url: "{% url 'save_dummy_numbers' %}",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({ course_code: courseCode, dummy_numbers: dummyNumbers }),
                    headers: { "X-CSRFToken": "{{ csrf_token }}" },
                    beforeSend: function() {
                        $("#submitBtn").text("Submitting...").prop("disabled", true);
                    },
                    success: function(response) {
                        alert("✅ " + response.success);
                        location.reload();
                    },
                    error: function(xhr) {
                        alert("❌ Error: " + xhr.responseText);
                        $("#submitBtn").text("Submit").prop("disabled", false);
                    }
                });
            });
        });
    </script>

    <script>
        document.getElementById("department").addEventListener("change", function () {
            const deptId = this.value;
            const programSelect = document.getElementById("program");
            programSelect.innerHTML = "<option value=''>-- Select Program --</option>";
            document.getElementById("semester").disabled = true;
            document.getElementById("course_code").disabled = true;
        
            if (deptId) {
                fetch(`/course/course_admin/load-programs/?department_id=${deptId}`)
                    .then(res => res.json())
                    .then(data => {
                        data.forEach(prog => {
                            programSelect.innerHTML += `<option value="${prog.id}">${prog.program_name}</option>`;
                        });
                        programSelect.disabled = false;
                    });
            } else {
                programSelect.disabled = true;
            }
        });
        
        document.getElementById("program").addEventListener("change", function () {
            document.getElementById("semester").disabled = false;
            document.getElementById("course_code").disabled = true;
        });
        
        document.getElementById("semester").addEventListener("change", function () {
            const programId = document.getElementById("program").value;
            const semester = this.value;
            const courseSelect = document.getElementById("course_code");
        
            courseSelect.innerHTML = "<option value=''>-- Select Course --</option>";
            if (programId && semester) {
                fetch(`/course/course_admin/load-courses/?program_id=${programId}&semester=${semester}`)
                    .then(res => res.json())
                    .then(data => {
                        data.forEach(course => {
                            courseSelect.innerHTML += `<option value="${course.course_code}">${course.course_code} - ${course.title}</option>`;
                        });
                        courseSelect.disabled = false;
                    });
            }
        });
        </script>

        <script>
            document.getElementById('departmentSelect').addEventListener('change', function () {
                const departmentId = this.value;
                const programSelect = document.getElementById('programSelect');
        
                programSelect.innerHTML = '<option value="">Loading...</option>';
        
                fetch(`/course/course_admin/load-programs/?department_id=${departmentId}`)
                .then(response => response.json())
                    .then(data => {
                        programSelect.innerHTML = '<option value="">-- Select Program --</option>';
                        data.forEach(program => {
                            const option = document.createElement('option');
                            option.value = program.id;
                            option.textContent = program.program_name;
                            programSelect.appendChild(option);
                        });
                    })
                    .catch(error => {
                        console.error('Error fetching programs:', error);
                        programSelect.innerHTML = '<option value="">Error loading</option>';
                    });
            });
        </script>
        
        
    
</body>
</html>

{% endblock content %}
