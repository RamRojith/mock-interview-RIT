<!-- Edit Course Modal -->
<div class="modal fade" id="editCourseModal" tabindex="-1" aria-labelledby="editCourseModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow-lg">
            <div class="modal-header bg-primary text-white border-0 rounded-top-4">
                <h5 class="modal-title fw-bold" id="editCourseModalLabel">Edit Course</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-5 glassmorphism-bg">
                <form method="post" id="editCourseForm" class="row g-3">
                    {% csrf_token %}
                    <input type="hidden" name="action" value="update">
                    <input type="hidden" name="course_id" id="modal_course_id">

                    <!-- Department (Read-only) -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-dark">Department:</label>
                        <input type="text" id="modal_department_name" class="form-control rounded-3 shadow-sm" readonly>
                    </div>

                    <!-- Course Code (Editable) -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-dark">Course Code:</label>
                        <input type="text" name="course_code" id="modal_course_code" class="form-control rounded-3 shadow-sm" required>
                    </div>

                    <!-- Title (Editable) -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-dark">Course Title:</label>
                        <input type="text" name="title" id="modal_title" class="form-control rounded-3 shadow-sm" required>
                    </div>

                    <!-- Regulation (Read-only) -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-dark">Regulation:</label>
                        <input type="text" id="modal_regulation_name" class="form-control rounded-3 shadow-sm" readonly>
                    </div>

                    <!-- Year (Read-only) -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-dark">Year:</label>
                        <input type="text" id="modal_year_name" class="form-control rounded-3 shadow-sm" readonly>
                    </div>

                    <!-- Semester (Read-only) -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-dark">Semester:</label>
                        <input type="text" id="modal_semester_name" class="form-control rounded-3 shadow-sm" readonly>
                    </div>

                    <!-- Category (Read-only) -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-dark">Category:</label>
                        <input type="text" id="modal_elective_name" class="form-control rounded-3 shadow-sm" readonly>
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex gap-3 justify-content-end mt-4">
                        <button type="button" class="btn btn-outline-primary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-4">Update Course</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- JS to populate modal -->
<script>
document.querySelectorAll('.edit-course-btn').forEach(button => {
    button.addEventListener('click', function () {
        const courseId = this.dataset.courseId;
        const courseCode = this.dataset.courseCode;
        const title = this.dataset.title;
        const departmentName = this.dataset.departmentName;
        const regulation = this.dataset.regulation;
        const year = this.dataset.year;
        const semester = this.dataset.semester;
        const elective = this.dataset.elective;

        document.getElementById('modal_course_id').value = courseId;
        document.getElementById('modal_course_code').value = courseCode;
        document.getElementById('modal_title').value = title;
        document.getElementById('modal_department_name').value = departmentName;
        document.getElementById('modal_regulation_name').value = regulation;
        document.getElementById('modal_year_name').value = year;
        document.getElementById('modal_semester_name').value = semester;
        document.getElementById('modal_elective_name').value = elective;
    });
});
</script>
