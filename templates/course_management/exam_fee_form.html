{% load static %}
 
<!-- Add Exam Fee Modal -->
<div class="modal fade" id="addExamFeeModal" tabindex="-1" role="dialog" aria-labelledby="addExamFeeModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title" id="addExamFeeModalLabel">Add Exam Fee</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="addExamFeeForm">
          {% csrf_token %}

          <!-- Program of Study -->
          <div class="form-group">
            <label for="programme_of_study" class="control-label">Program of Study</label>
            <select name="programme_of_study" id="programme_of_study" class="form-select" required>
              <option value="" disabled selected>Select Programme</option>
              <option value="Certificate">Certificate</option>
              <option value="Diploma">Diploma</option>
              <option value="Advanced Diploma">Advanced Diploma</option>
              <option value="Bachelor Degree">Bachelor Degree</option>
              <option value="Postgraduate Diploma">Postgraduate Diploma</option>
              <option value="Master Degree">Master Degree</option>
            </select>
          </div>

          <!-- Exam Fee -->
          <div class="form-group mt-3">
            <label for="exam_fee" class="control-label">Exam Fee</label>
            <input type="number" class="form-control" id="exam_fee" name="exam_fee" placeholder="Enter exam fee" required>
          </div>

          <!-- Course Type -->
          <div class="form-group mt-3">
            <label for="course_type" class="control-label">Course Type</label>
            <select name="course_type" id="course_type" class="form-select" required>
              <option value="" disabled selected>Select Course Type</option>
              <option value="Laboratory">Laboratory</option>
              <option value="Theory">Theory</option>
            </select>
          </div>

          <!-- Year -->
          <div class="form-group mt-3">
            <label for="year" class="control-label">Year</label>
            <select name="year" id="year" class="form-select" required>
              <option value="" disabled selected>Select Year</option>
              <option value="1">Year I</option>
              <option value="2">Year II</option>
              <option value="3">Year III</option>
              <option value="4">Year IV</option>
            </select>
          </div>

          <button type="button" class="btn btn-primary mt-3" id="addExamFeeBtn">Add Exam Fee</button>

        </form>
      </div>
      <form action="{% url 'update_exam_fees' %}" method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">Update Exam Fees</button>
    </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById("addExamFeeBtn").addEventListener("click", function() {
    var programme = document.getElementById("programme_of_study").value;
    var examFee = document.getElementById("exam_fee").value;
    var courseType = document.getElementById("course_type").value;
    var year = document.getElementById("year").value;

    if (!programme || !examFee || !courseType || !year) {
        alert("Please fill all fields.");
        return;
    }

    fetch("{% url 'add_exam_fee' %}", {
        method: "POST",
        headers: {
            "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value,
            "Content-Type": "application/json",
        },
        body: JSON.stringify({
            programme_of_study: programme,
            exam_fee: examFee,
            course_type: courseType,
            year: year
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert("Exam Fee added successfully!");
            location.reload();
        } else {
            alert("Error adding exam fee.");
        }
    })
    .catch(error => console.error("Error:", error));
  });
</script>
