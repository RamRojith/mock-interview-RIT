{% extends 'base.html' %}
{% block content %}

<h1>Generate Exam</h1>

<!-- Modal Trigger -->
<a href="#" id="generateExamButton" data-toggle="modal" data-target="#generateExamModal" class="btn btn-primary">
    Open Generate Exam
</a>

<!-- Modal for Generate Exam -->
<div class="modal fade" id="generateExamModal" tabindex="-1" role="dialog" aria-labelledby="generateExamModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="generateExamModalLabel">Generate Exam</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="modal-body">
                <form method="POST" id="generateExamForm">
                    {% csrf_token %}

                    <!-- Department Selection -->
                    <div class="form-group">
                        <label for="deptId">Select Department:</label>
                        <select class="form-control" id="deptId" name="deptId" required>
                            <option value="">Loading departments...</option>
                        </select>
                    </div>

                    <!-- Program Selection -->
                    <div class="form-group">
                        <label for="programId">Select Program:</label>
                        <select class="form-control" id="programId" name="programId" required>
                            <option value="">Select a department first</option>
                        </select>
                    </div>

                    <!-- Semester Selection -->
                    <div class="form-group">
                        <label for="semesterGenerate">Select Semester:</label>
                        <select class="form-control" id="semesterGenerate" name="semesterGenerate" required>
                            <option value="">Select a program first</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Generate</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Container for Exam Tables -->
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center">
        <h2>Exam Schedules</h2>
        <button id="downloadPdfBtn" class="btn btn-danger" style="display: none;">Download as PDF</button>
    </div>
    <div id="examTablesContainer"></div>
</div>

<!-- jQuery for Dynamic Dropdowns -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
    $(document).ready(function () {
        let selectedExams = [];

        // Load departments on page load
        $.getJSON("{% url 'get_departments' %}", function (data) {
            $('#deptId').html('<option value="">Select Department...</option>');
            $.each(data.departments, function (index, department) {
                $('#deptId').append('<option value="' + department.id + '">' + department.Department + '</option>');
            });
        });

        // Load Programs based on Department selection
        $('#deptId').change(function () {
            var departmentId = $(this).val();
            $('#programId').html('<option value="">Loading...</option>');

            if (departmentId) {
                $.getJSON("{% url 'get_programs' %}", {'department_id': departmentId}, function (data) {
                    $('#programId').html('<option value="">Select a program...</option>');
                    $.each(data.programs, function (index, program) {
                        $('#programId').append('<option value="' + program.id + '">' + program.program_name + '</option>');
                    });
                    $('#semesterGenerate').html('<option value="">Select a program first</option>'); // Reset semester dropdown
                });
            } else {
                $('#programId').html('<option value="">Select a department first</option>');
                $('#semesterGenerate').html('<option value="">Select a program first</option>');
            }
        });

        // Load Semesters based on Program selection
        $('#programId').change(function () {
            var programId = $(this).val();
            $('#semesterGenerate').html('<option value="">Loading...</option>');

            if (programId) {
                $.getJSON("{% url 'get_semesters_for_exam' %}", {'program_id': programId}, function (data) {
                    $('#semesterGenerate').html('<option value="">Select a semester...</option>');
                    $.each(data.semesters, function (index, semesterRange) {
                        $('#semesterGenerate').append('<option value="' + semesterRange + '">' + semesterRange + '</option>');
                    });
                });
            } else {
                $('#semesterGenerate').html('<option value="">Select a program first</option>');
            }
        });

        // AJAX form submission for Generate Exam and fetch Exam Schedule
        $('#generateExamForm').submit(function (event) {
            event.preventDefault();
            var departmentId = $('#deptId').val();
            var programId = $('#programId').val();
            var semesterRange = $('#semesterGenerate').val();
            var container = $('#examTablesContainer');

            $.getJSON("{% url 'get_exam_schedule' %}", {
                'department_id': departmentId,
                'program_id': programId,
                'semester_range': semesterRange
            }, function (data) {
                if (data.exam_schedules.length > 0) {
                    var deptName = data.exam_schedules[0].department;
                    var programName = data.exam_schedules[0].program;

                    var newTable = `
                        <div class="exam-table-container mt-4">
                            <h3><strong>Department:</strong> ${deptName}</h3>
                            <h4><strong>Program:</strong> ${programName}</h4>
                            <table class="table table-bordered">
                                <thead>
                                    <tr>
                                        <th>S.No</th>
                                        <th>Semester</th>
                                        <th>Course Code</th>
                                        <th>Course Title</th>
                                        <th>Date</th>
                                        <th>Session</th>
                                    </tr>
                                </thead>
                                <tbody>`;

                    let failedSubjects = ["Mathematics", "Physics", "Statistics"]; // Manually define failed subjects

                    $.each(data.exam_schedules, function (index, exam) {
                        let isFailed = failedSubjects.includes(exam.course); // Check if course is in failed subjects list
                        let rowClass = isFailed ? "text-danger font-weight-bold" : ""; 

                        newTable += `
                            <tr class="${rowClass}">
                                <td>${index + 1}</td>
                                <td>${exam.semester}</td>
                                <td>${exam.course_code}</td>
                                <td>${exam.course}</td>
                                <td>${exam.date}</td>
                                <td>${exam.session}</td>
                            </tr>`;
                    });

                    newTable += `</tbody></table></div>`;

                    container.append(newTable);
                    selectedExams.push({ department_id: departmentId, program_id: programId, semester_range: semesterRange });
                    $('#downloadPdfBtn').show();
                } else {
                    container.append('<p class="text-danger">No exams found</p>');
                }
            });
        });

        // Download PDF button click event
        $('#downloadPdfBtn').click(function () {
            if (selectedExams.length === 0) return;
            let queryParams = selectedExams.map((exam, index) =>
                `department_id_${index}=${exam.department_id}&program_id_${index}=${exam.program_id}&semester_range_${index}=${exam.semester_range}`
            ).join('&');
            var downloadUrl = "{% url 'download_exam_schedule' %}?" + queryParams;
            window.open(downloadUrl, '_blank');
        });
    });
</script>

{% endblock %}
