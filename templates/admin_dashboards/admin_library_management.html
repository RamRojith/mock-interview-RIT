{% extends "base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'admin_dashboard_css.css' %}" />

<div class="container-fluid py-4">

  <!-- Header -->
  <div style="border-bottom: 2px solid #000; padding-bottom: 8px;">
    <h2 class="fw-semibold">Manage</h2>
  </div>

  <!-- Cards Row -->
  <div class="row mt-4 g-4">

    <!-- ================= ADD PERMISSION CARD ================= -->
    <div class="col-md-3 col-sm-6">
      <a data-bs-toggle="modal" data-bs-target="#addpermissionModal" class="text-decoration-none">
        <div class="card shadow-sm border-0 text-center hover-scale d-flex align-items-center justify-content-center"
             style="background: linear-gradient(135deg, #9c3747, #4286f4);
                    height: 120px; border-radius: 12px;">
          <div class="card-body">
            <i class="fas fa-lock" style="font-size: 2rem; color: white;"></i>
            <h6 class="mt-2 text-white">Add Permission</h6>
          </div>
        </div>
      </a>
    </div>

    {% include 'library_management/admin/add_permission.html' %}

    <!-- ================= BOOK TYPE CARD ================= -->
    <div class="col-md-3 col-sm-6">
      <a href="{% url 'book_type_page' %}" class="text-decoration-none">
        <div class="card shadow-sm border-0 text-center hover-scale d-flex align-items-center justify-content-center"
             style="background: linear-gradient(135deg, #0f9b8e, #30cfd0);
                    height: 120px; border-radius: 12px;">
          <div class="card-body">
            <i class="fas fa-book" style="font-size: 2rem; color: white;"></i>
            <h6 class="mt-2 text-white">Book Type</h6>
          </div>
        </div>
      </a>
    </div>

    <!-- ================= BOOK ENTRY CARD ================= -->
    <div class="col-md-3 col-sm-6">
      <a href="{% url 'library_book_entry' %}" class="text-decoration-none">
        <div class="card shadow-sm border-0 text-center hover-scale d-flex align-items-center justify-content-center"
             style="background: linear-gradient(135deg, #5f2c82, #49a09d);
                    height: 120px; border-radius: 12px;">
          <div class="card-body">
            <i class="fas fa-book-open" style="font-size: 2rem; color: white;"></i>
            <h6 class="mt-2 text-white">Book Entry</h6>
          </div>
        </div>
      </a>
    </div>

    <!-- ================= ANALYTICS DASHBOARD CARD ================= -->
    <div class="col-md-3 col-sm-6">
      <a href="{% url 'library_analytics_dashboard' %}" class="text-decoration-none">
        <div class="card shadow-sm border-0 text-center hover-scale d-flex align-items-center justify-content-center"
             style="background: linear-gradient(135deg, #ff512f, #dd2476);
                    height: 120px; border-radius: 12px;">
          <div class="card-body">
            <i class="fas fa-chart-line" style="font-size: 2rem; color: white;"></i>
            <h6 class="mt-2 text-white">Analytics Dashboard</h6>
          </div>
        </div>
      </a>
    </div>

    <!-- ================= STUDENT BOOK REQUEST CARD ================= -->
    <div class="col-md-3 col-sm-6">
      <a href="{% url 'student_request_book' %}" class="text-decoration-none">
        <div class="card shadow-sm border-0 text-center hover-scale d-flex align-items-center justify-content-center"
             style="background: linear-gradient(135deg, #11998e, #38ef7d);
                    height: 120px; border-radius: 12px;">
          <div class="card-body">
            <i class="fas fa-user-graduate" style="font-size: 2rem; color: white;"></i>
            <h6 class="mt-2 text-white">Student Book Request</h6>
          </div>
        </div>
      </a>
    </div>

    <!-- ================= APPROVAL MANAGEMENT CARD ================= -->
    <div class="col-md-3 col-sm-6">
      <a href="{% url 'library_request_approval_management' %}" class="text-decoration-none">
        <div class="card shadow-sm border-0 text-center hover-scale d-flex align-items-center justify-content-center"
             style="background: linear-gradient(135deg, #667eea, #764ba2);
                    height: 120px; border-radius: 12px;">
          <div class="card-body">
            <i class="fas fa-tasks" style="font-size: 2rem; color: white;"></i>
            <h6 class="mt-2 text-white">Approval Management</h6>
          </div>
        </div>
      </a>
    </div>

    <!-- ================= DEPARTMENT LIBRARY INCHARGE CARD (NEW) ================= -->
    <div class="col-md-3 col-sm-6">
      <a href="{% url 'library_incharge_requests' %}" class="text-decoration-none">
        <div class="card shadow-sm border-0 text-center hover-scale d-flex align-items-center justify-content-center"
             style="background: linear-gradient(135deg, #1d976c, #93f9b9);
                    height: 120px; border-radius: 12px;">
          <div class="card-body">
            <i class="fas fa-user-shield" style="font-size: 2rem; color: white;"></i>
            <h6 class="mt-2 text-white">Department Library Incharge</h6>
          </div>
        </div>
      </a>
    </div>

    <!-- ================= HOD BOOK REQUESTS CARD ================= -->
    <div class="col-md-3 col-sm-6">
      <a href="{% url 'hod_library_requests' %}" class="text-decoration-none">
        <div class="card shadow-sm border-0 text-center hover-scale d-flex align-items-center justify-content-center"
             style="background: linear-gradient(135deg, #f7971e, #ffd200);
                    height: 120px; border-radius: 12px;">
          <div class="card-body">
            <i class="fas fa-user-tie" style="font-size: 2rem; color: white;"></i>
            <h6 class="mt-2 text-white">HOD Book Requests</h6>
          </div>
        </div>
      </a>
    </div>

  </div>
</div>

<style>
.hover-scale {
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.hover-scale:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}
</style>

{% endblock content %}
