{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-lg rounded">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">✏️ Edit Admission Reference</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="admission_sourse" class="form-label">Admission Source</label>
                            <input type="text" name="admission_sourse" id="admission_sourse"
                                   class="form-control"
                                   placeholder="Enter admission source"
                                   value="{{ reference.admission_sourse }}">
                        </div>
                        <div class="mb-3">
                            <label for="admission_reference" class="form-label">Admission Reference</label>
                            <input type="text" name="admission_reference" id="admission_reference"
                                   class="form-control"
                                   placeholder="Enter admission reference"
                                   value="{{ reference.admission_reference }}">
                        </div>
                        <div class="mb-3">
                            <label for="user_id" class="form-label">User ID</label>
                            <input type="text" name="user_id" id="user_id"
                                   class="form-control"
                                   placeholder="Enter user ID"
                                   value="{{ reference.user_id }}">
                        </div>
                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-success">
                                💾 Update
                            </button>
                            <a href="{% url 'admission_reference_list' %}" class="btn btn-secondary">
                                ⬅ Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
