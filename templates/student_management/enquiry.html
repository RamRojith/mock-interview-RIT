{% load authorizer_tags %}
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
          <link rel="website icon" type="png" href="{% static 'image/Edenberg.png' %}">

    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3a0ca3;
            --success-color: #2a9d8f;
            --danger-color: #e76f51;
            --warning-color: #f4a261;
            --light-color: #f8f9fa;
            --dark-color: #2b2d42;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: #495057;
            line-height: 1.6;
        }
        
        .form-container {
            max-width: 800px;
            margin: 40px auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        
        .form-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
        }
        
        .form-header h2 {
            font-weight: 700;
            margin-bottom: 0;
            font-size: 1.8rem;
        }
        
        .form-body {
            padding: 30px;
        }
        
        .form-section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-title i {
            color: var(--primary-color);
        }
        
        .form-label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #495057;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .required-asterisk {
            color: var(--danger-color);
        }
        
        .form-control, .form-select {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
        }
        
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }
        
        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .radio-option input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
        }
        
        .radio-option label {
            margin-bottom: 0;
            font-weight: 500;
        }
        
        .btn-submit {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.3);
        }
        
        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .iti {
            width: 100%;
        }
        
        .iti__selected-flag {
            padding: 0 15px;
        }
        
        .valid-feedback, .invalid-feedback {
            font-size: 0.85rem;
            margin-top: 5px;
        }
        
        .valid-feedback {
            color: var(--success-color);
        }
        
        .invalid-feedback {
            color: var(--danger-color);
        }
        
        .is-invalid {
            border-color: var(--danger-color);
        }
        
        .is-valid {
            border-color: var(--success-color);
        }
        
        @media (max-width: 768px) {
            .form-container {
                margin: 20px auto;
                border-radius: 0;
            }
            
            .form-header {
                padding: 20px;
            }
            
            .form-body {
                padding: 20px;
            }
            
            .radio-group {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h2><i class="fas fa-envelope me-2"></i>Enquiry Form</h2>
        </div>
        
        <form method="POST" class="form-body" id="enquiryForm">
            {% csrf_token %}
            
            {% if messages %}
                <div class="alert alert-danger mb-4">
                    <ul class="mb-0">
                        {% for message in messages %}
                            <li>{{ message }}</li>
                        {% endfor %}
                    </ul>
                </div>
            {% endif %}
            
            <!-- Personal Information Section -->
            <div class="form-section">
                <h3 class="section-title"><i class="fas fa-user"></i>Personal Information</h3>
                
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="name" class="form-label">
                            <i class="fas fa-signature"></i> Full Name
                            <span class="required-asterisk">*</span>
                        </label>
                        <input type="text" id="name" name="name" class="form-control" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope"></i> Email
                            <span class="required-asterisk">*</span>
                        </label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="nrc_number" class="form-label">
                            <i class="fas fa-id-card"></i> NRC Number
                            <span class="required-asterisk">*</span>
                        </label>
                        <input type="text" id="nrc_number" name="nrc_number" class="form-control" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="nationality" class="form-label">
                            <i class="fas fa-globe"></i> Nationality
                            <span class="required-asterisk">*</span>
                        </label>
                        <input type="text" id="nationality" name="nationality" class="form-control" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="passport_number" class="form-label">
                            <i class="fas fa-passport"></i> Passport Number
                            <span class="required-asterisk">*</span>
                        </label>
                        <input type="text" id="passport_number" name="passport_number" class="form-control" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="phone" class="form-label">
                            <i class="fas fa-phone"></i> Phone Number
                            <span class="required-asterisk">*</span>
                        </label>
                        <input type="tel" id="phone" name="phone_number" class="form-control" required>
                        <div class="valid-feedback" id="valid-msg">Valid number</div>
                        <div class="invalid-feedback" id="error-msg">Invalid number</div>
                    </div>
                </div>
            </div>
            
            <!-- Program Information Section -->
            <div class="form-section">
                <h3 class="section-title"><i class="fas fa-graduation-cap"></i>Program Information</h3>
                
                <div class="row g-3">
                    <div class="col-md-12">
                        <label class="form-label">
                            <i class="fas fa-book"></i> Programme of Study
                            <span class="required-asterisk">*</span>
                        </label>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" id="undergraduate" name="program_of_study" value="Undergraduate" required onchange="toggleProgram()">
                                <label for="undergraduate">Undergraduate</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="postgraduate" name="program_of_study" value="Postgraduate" onchange="toggleProgram()">
                                <label for="postgraduate">Postgraduate</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="certificate" name="program_of_study" value="Certificate" onchange="toggleProgram()">
                                <label for="certificate">Certificate</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6" id="programContainer">
                        <label for="program" class="form-label">
                            <i class="fas fa-list"></i> Program
                            <span class="required-asterisk">*</span>
                        </label>
                        <select name="program" class="form-select" required>
                            <option value="" disabled selected hidden>Select Program</option>
                            {% Program_data as program %}
                            {% for dept in program %}
                                <option value="{{ dept.program_code }}">{{ dept.program_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-6" id="certificateProgramContainer" style="display: none;">
                        <label for="certificate_program" class="form-label">
                            <i class="fas fa-certificate"></i> Certificate Program
                            <span class="required-asterisk">*</span>
                        </label>
                        <select id="certificate_program" name="certificate_program" class="form-select" onchange="toggleOtherProgram()">
                            <option value="" disabled selected hidden>Choose Program...</option>
                            <option value="Cyber Security">Cyber Security</option>
                            <option value="Artificial Intelligence">Artificial Intelligence</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>
                    
                    <div class="col-md-6" id="otherProgramContainer" style="display: none;">
                        <label for="other_certificate_program" class="form-label">
                            <i class="fas fa-edit"></i> Specify Program
                            <span class="required-asterisk">*</span>
                        </label>
                        <input type="text" id="other_certificate_program" class="form-control" placeholder="Enter program name" oninput="updateCertificateProgram()">
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label">
                            <i class="fas fa-laptop-house"></i> Mode of Study
                            <span class="required-asterisk">*</span>
                        </label>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" id="online" name="mode" value="Online" required>
                                <label for="online">Online</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="regular" name="mode" value="Regular">
                                <label for="regular">Regular</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-paper-plane me-1"></i> Submit Enquiry
                </button>
            </div>
        </form>
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
    
    <script>
        // Initialize phone number input
        const phoneInput = document.querySelector("#phone");
        const errorMsg = document.querySelector("#error-msg");
        const validMsg = document.querySelector("#valid-msg");
        const submitBtn = document.querySelector("#submitBtn");
        
        const iti = window.intlTelInput(phoneInput, {
            initialCountry: "zm",
            preferredCountries: ["zm", "us", "gb", "in"],
            utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js",
        });
        
        // Validate phone number on blur
        phoneInput.addEventListener('blur', validatePhoneNumber);
        phoneInput.addEventListener('change', validatePhoneNumber);
        phoneInput.addEventListener('keyup', validatePhoneNumber);
        
        function validatePhoneNumber() {
            if (phoneInput.value.trim()) {
                if (iti.isValidNumber()) {
                    phoneInput.classList.add('is-valid');
                    phoneInput.classList.remove('is-invalid');
                    validMsg.style.display = 'block';
                    errorMsg.style.display = 'none';
                    return true;
                } else {
                    phoneInput.classList.add('is-invalid');
                    phoneInput.classList.remove('is-valid');
                    validMsg.style.display = 'none';
                    errorMsg.style.display = 'block';
                    return false;
                }
            } else {
                phoneInput.classList.remove('is-valid', 'is-invalid');
                validMsg.style.display = 'none';
                errorMsg.style.display = 'none';
                return false;
            }
        }
        
        // Form submission handler
        document.getElementById('enquiryForm').addEventListener('submit', function(e) {
            // Validate phone number before submission
            if (!validatePhoneNumber()) {
                e.preventDefault();
                return;
            }
            
            // Disable button and show loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Submitting...';
        });
        
        // Program type toggle
        function toggleProgram() {
            const certificateSelected = document.getElementById("certificate").checked;
            document.getElementById("programContainer").style.display = certificateSelected ? "none" : "block";
            document.getElementById("certificateProgramContainer").style.display = certificateSelected ? "block" : "none";
            
            // Reset other program container when switching
            if (!certificateSelected) {
                document.getElementById("otherProgramContainer").style.display = "none";
            }
        }
        
        // Other program toggle
        function toggleOtherProgram() {
            const certificateProgram = document.getElementById("certificate_program");
            const otherContainer = document.getElementById("otherProgramContainer");
            
            if (certificateProgram.value === "Others") {
                otherContainer.style.display = "block";
            } else {
                otherContainer.style.display = "none";
            }
        }
        
        // Update certificate program value
        function updateCertificateProgram() {
            const otherInput = document.getElementById("other_certificate_program");
            const certificateProgram = document.getElementById("certificate_program");
            
            if (certificateProgram.value === "Others") {
                certificateProgram.setAttribute("name", "certificate_program_other");
                otherInput.setAttribute("name", "certificate_program");
            } else {
                certificateProgram.setAttribute("name", "certificate_program");
                otherInput.removeAttribute("name");
            }
        }
    </script>
</body>
</html>
