{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg rounded">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Edit Admission Source</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="admission_sourse" class="form-label">Source Name</label>
                            <input type="text" 
                                   name="admission_sourse" 
                                   id="admission_sourse" 
                                   value="{{ source.admission_sourse }}" 
                                   class="form-control" 
                                   placeholder="Enter source name" 
                                   required>
                        </div>
                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-success">💾 Update</button>
                            <a href="{% url 'admission_source_list' %}" class="btn btn-secondary">⬅ Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
