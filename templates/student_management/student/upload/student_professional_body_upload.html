{% extends 'base.html' %}

{% block content %}
<style>
.registration-container {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
    min-height: 100vh;
    padding: 2rem 1rem;
    display: flex;
    justify-content: center;
    align-items: center;
}

.registration-container .page-wrapper {
    max-width: 800px;
    margin: 0 auto;
    width: 100%;
}

.registration-container .registration-card {
    background: white;
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
    border: 1px solid #e2e8f0;
    padding: 0;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.registration-container .registration-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
}

.registration-container .card-header {
    background: linear-gradient(135deg, #1a4b8c 0%, #2c5aa0 100%);
    color: white;
    padding: 2rem;
    text-align: center;
    border-bottom: none;
}

.registration-container .card-header h4 {
    font-size: 1.75rem;
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
}

.registration-container .card-header i {
    font-size: 2rem;
}

.registration-container .card-body {
    padding: 3rem;
}

.registration-container .form-group {
    margin-bottom: 2rem;
}

.registration-container .form-group label {
    font-weight: 700;
    color: #1a4b8c;
    margin-bottom: 0.75rem;
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.registration-container .form-group label i {
    color: #64748b;
    font-size: 1rem;
    width: 20px;
}

.registration-container .form-group input,
.registration-container .form-group select {
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    padding: 1rem 1.25rem;
    font-size: 1rem;
    background: white;
    color: #1e293b;
    transition: all 0.3s ease;
    font-weight: 500;
    width: 100%;
}

.registration-container .form-group input:focus,
.registration-container .form-group select:focus {
    border-color: #1a4b8c;
    box-shadow: 0 0 0 4px rgba(26, 75, 140, 0.15);
    transform: translateY(-2px);
    outline: none;
}

.registration-container .form-group input[readonly] {
    background-color: #f8fafc;
    border-color: #e2e8f0;
    color: #64748b;
    cursor: not-allowed;
}

.registration-container .submit-btn {
    background: linear-gradient(135deg, #1a4b8c 0%, #2c5aa0 100%);
    color: white;
    border: none;
    padding: 1.25rem 3rem;
    border-radius: 14px;
    font-weight: 700;
    font-size: 1.1rem;
    transition: all 0.3s ease;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
    justify-content: center;
    margin-top: 1rem;
    position: relative;
    overflow: hidden;
}

.registration-container .submit-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s;
}

.registration-container .submit-btn:hover::before {
    left: 100%;
}

.registration-container .submit-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(26, 75, 140, 0.4);
    background: linear-gradient(135deg, #153e75 0%, #1e4a8e 100%);
}

.registration-container .student-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    margin-bottom: 2rem;
}

/* Responsive Design */
@media (max-width: 768px) {
    .registration-container {
        padding: 1rem 0.5rem;
    }
    
    .registration-container .card-body {
        padding: 2rem;
    }
    
    .registration-container .card-header {
        padding: 1.5rem;
    }
    
    .registration-container .card-header h4 {
        font-size: 1.5rem;
    }
    
    .registration-container .student-info-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
    }
    
    .registration-container .form-group input,
    .registration-container .form-group select {
        padding: 0.875rem 1rem;
        font-size: 0.95rem;
    }
    
    .registration-container .submit-btn {
        padding: 1rem 2rem;
        font-size: 1rem;
    }
}

@media (max-width: 480px) {
    .registration-container .card-body {
        padding: 1.5rem;
    }
    
    .registration-container .card-header h4 {
        font-size: 1.3rem;
        flex-direction: column;
        gap: 0.5rem;
    }
}

/* Animation for form elements */
.registration-container .form-group {
    animation: fadeInUp 0.6s ease forwards;
    opacity: 0;
}

.registration-container .form-group:nth-child(1) { animation-delay: 0.1s; }
.registration-container .form-group:nth-child(2) { animation-delay: 0.2s; }
.registration-container .form-group:nth-child(3) { animation-delay: 0.3s; }
.registration-container .form-group:nth-child(4) { animation-delay: 0.4s; }
.registration-container .form-group:nth-child(5) { animation-delay: 0.5s; }
.registration-container .form-group:nth-child(6) { animation-delay: 0.6s; }
.registration-container .form-group:nth-child(7) { animation-delay: 0.7s; }
.registration-container .form-group:nth-child(8) { animation-delay: 0.8s; }
.registration-container .submit-btn { animation-delay: 0.9s; }

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>

<div class="registration-container">
    <div class="page-wrapper">
        <div class="registration-card">
            <div class="card-header">
                <h4><i class="fa-solid fa-id-card-clip"></i>Professional Body Registration</h4>
            </div>
            
            <div class="card-body">
                <form method="post" id="registrationForm">
                    {% csrf_token %}

                    <div class="student-info-grid">

                        <div class="form-group">
                            <label><i class="fa-solid fa-user"></i>Register Number</label>
                            <input type="text" value="{{ reg_no }}" readonly>
                        </div>

                        <div class="form-group">
                            <label><i class="fa-solid fa-user"></i>Student Name</label>
                            <input type="text" value="{{ name }}" readonly>
                        </div>

                        <div class="form-group">
                            <label><i class="fa-solid fa-building"></i>Department</label>
                            <input type="text" value="{{ department }}" readonly>
                        </div>

                        <div class="form-group">
                            <label><i class="fa-solid fa-users"></i>Section</label>
                            <input type="text" value="{{ section }}" readonly>
                        </div>

                        <div class="form-group">
                            <label><i class="fa-solid fa-graduation-cap"></i>Semester</label>
                            <input type="text" value="{{ semester }}" readonly>
                        </div>

                        <div class="form-group">
                            <label><i class="fa-solid fa-calendar-star"></i>Year</label>
                            <input type="text" value="{{ year }}" readonly>
                        </div>

                        <div class="form-group">
                            <label><i class="fa-solid fa-calendar-days"></i>Academic Year</label>
                            <select name="academic_year" id="academic_year" required>
                                <option value="" hidden selected>Select Academic Year</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fa-solid fa-building-columns"></i>Professional Body Name</label>
                        <input type="text" name="bodyName" required placeholder="Enter professional body name">
                    </div>

                    <div class="form-group">
                        <label><i class="fa-solid fa-clock"></i>Validity</label>
                        <select name="validity" required>
                            <option value="" hidden selected>Select Validity</option>
                            <option value="lifetime">Lifetime</option>
                            <option value="period">Validity Period</option>
                        </select>
                    </div>

                    <button type="submit" class="submit-btn">
                        <i class="fa-solid fa-paper-plane"></i>Submit Registration
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
// Generate Academic Year options dynamically
(function generateAcademicYears() {
    const select = document.getElementById("academic_year");

    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth() + 1;

    // Determine current academic year
    let currentStartYear = month >= 7 ? year : year - 1;

    let start = currentStartYear - 2; // previous 2
    let end = currentStartYear + 3;  // next 3

    for (let y = start; y <= end; y++) {
        let optionText = `${y}-${y + 1}`;
        let opt = document.createElement("option");
        opt.value = optionText;
        opt.textContent = optionText;
        select.appendChild(opt);
    }
})();

// Form submission loading state
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('registrationForm');
    
    form.addEventListener('submit', function() {
        const submitBtn = this.querySelector('.submit-btn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Submitting...';
    });
});
</script>

{% endblock %}
