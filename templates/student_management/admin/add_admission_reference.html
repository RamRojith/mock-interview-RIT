{% load static %}
<!-- Add Admission Reference Modal -->
<div class="modal fade" id="addAdmissionReferneceModal" tabindex="-1" role="dialog" aria-labelledby="addAdmissionReferenceModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title" id="addAdmissionReferenceModalLabel">Add Admission Reference</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="addAdmissionSourseForm" action="{% url 'add_admission_reference' %}" method="POST">
          {% csrf_token %}

          <!-- Admission Source -->
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="admission_sourse" class="form-label fw-semibold">Admission Source</label>
              <select class="form-select" id="admission_sourse" name="admission_sourse" required>
                <option selected disabled value="">Choose Admission Source...</option>
                <option value="Internal">Internal</option>
                <option value="External">External</option>
              </select>
            </div>
          </div>

          <!-- Admission Reference -->
          <div id="programList">
            <div class="row mb-3">
              <div class="col-md-12">
                <label for="admission_reference" class="control-label">Admission Reference</label>
                <input type="text" class="form-control" id="admission_reference" name="admission_reference[]" placeholder="Enter Admission Reference" required>
              </div>
            </div>
          </div>

          <!-- User ID -->
          <div class="row mb-3">
            <div class="col-md-12">
              <label for="user_id" class="control-label">User ID</label>
              <input type="text" class="form-control" id="user_id" name="user_id" placeholder="Enter User ID" required>
            </div>
          </div>

          <!-- Add Another Resource -->
          <button type="button" class="btn btn-outline-secondary mb-3" id="addProgramBtn">+ Add another Resource</button>

          <!-- Submit -->
          <button type="submit" class="btn btn-primary mb-3">Add Admission Reference</button>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
