{% extends "base.html" %}
{% load static %}
<link rel="stylesheet" href="{% static 'admin_dashboard_css.css' %}" />

{% block content %}
<div class="container-fluid py-4">
    <div style="border-bottom: 2px solid #000; padding-bottom: 8px; ">
        <h2>Marketing Team</h2>
    </div>
    <div class="row g-4 justify-content-center mt-1">
        <div class="col-md-2 col-sm-6">
            <a data-bs-toggle="modal" data-bs-target="#addAdmissionSourseModal" class="text-decoration-none">
              <div class="card shadow-sm border-0 text-center hover-scale" style="background: linear-gradient(135deg, rgb(122, 8, 27), #4286f4);">
                  <div class="card-body text-warning">
                      <i class="fas fa-plus-circle" style="font-size: 2rem; color: white;"></i>
                      <h6 class="mt-2 text-white">Admission Sourse</h6>
                  </div>
              </div>
            </a>
          </div>
          <div class="col-md-2 col-sm-6">
            <a data-bs-toggle="modal" data-bs-target="#addAdmissionReferneceModal" class="text-decoration-none">
              <div class="card shadow-sm border-0 text-center hover-scale" style="background: linear-gradient(135deg, rgb(122, 8, 27), #4286f4);">
                  <div class="card-body text-warning">
                      <i class="fas fa-plus-circle" style="font-size: 2rem; color: white;"></i>
                      <h6 class="mt-2 text-white">Admission Reference</h6>
                  </div>
              </div>
            </a>
          </div>  
        </div>
        
      <div style="border-bottom: 2px solid #000; padding-bottom: 8px; ">
        <h2>Manage</h2>
      </div>
      <div class="row g-4 justify-content-center mt-1">  
        <div class="col-md-2 col-sm-6">
          <button onclick="window.location.href='{% url 'enquiry_dashboard' %}'" 
          class="card shadow-sm border-0 text-center hover-scale d-flex align-items-center justify-content-center" 
          style="background: linear-gradient(135deg,rgb(30, 114, 34), rgb(42, 152, 141)); border: none; height: 100px; width: 150px;">
              <div class="card-body">
                  <i class="fa-solid fa-person-circle-question" style="font-size: 2rem; color: #fff;"></i>
                  <h6 class="mt-2 text-white">Enquiry Dashboard</h6>
              </div>
          </button>
        </div>
        <div class="col-md-2 col-sm-6">
          <button onclick="window.location.href='{% url 'approve_enquiries' %}'" 
          class="card shadow-sm border-0 text-center hover-scale d-flex align-items-center justify-content-center" 
          style="background: linear-gradient(135deg,rgb(30, 114, 34), rgb(42, 152, 141)); border: none; height: 100px; width: 150px;">
              <div class="card-body">
                  <i class="fa-solid fa-person-circle-question" style="font-size: 2rem; color: #fff;"></i>
                  <h6 class="mt-2 text-white">Approve Enquiry</h6>
              </div>
          </button>
        </div>
        <div class="col-md-2 col-sm-6">
          <button onclick="window.location.href='{% url 'student_approve' %}'"
            class="card shadow-sm border-0 text-center hover-scale d-flex align-items-center justify-content-center" 
            style="background: linear-gradient(135deg,rgb(30, 114, 34), rgb(42, 152, 141)); border: none; height: 100px; width: 150px;">  
        
              <div class="card-body">
                  <i class="fa-solid fa-person-circle-question" style="font-size: 2rem; color: #fff;"></i>
                  <h6 class="mt-2 text-white">Student Approval</h6>
              </div>
          </button>
        </div>
        <div class="col-md-2 col-sm-6">
          <button onclick="window.location.href='{% url 'update_student_details' %}'" 
          class="card shadow-sm border-0 text-center hover-scale d-flex align-items-center justify-content-center" 
          style="background: linear-gradient(135deg,rgb(30, 114, 34), rgb(42, 152, 141)); border: none; height: 100px; width: 150px;">
              <div class="card-body">
                  <i class="fa-solid fa-person-circle-question" style="font-size: 2rem; color: #fff;"></i>
                  <h6 class="mt-2 text-white">Update Student Details</h6>
              </div>
          </button>
        </div>
        <div class="col-md-2 col-sm-6">
          <button onclick="window.location.href='{% url 'assign_mentor' %}'"
            class="card shadow-sm border-0 text-center hover-scale d-flex align-items-center justify-content-center" 
            style="background: linear-gradient(135deg,rgb(30, 114, 34), rgb(42, 152, 141)); border: none; height: 100px; width: 150px;">  
        
              <div class="card-body">
                  <i class="fa-solid fa-person-circle-question" style="font-size: 2rem; color: #fff;"></i>
                  <h6 class="mt-2 text-white">Assign Mentor</h6>
              </div>
          </button>
        </div>
      </div>
    </div>
{% include 'student_management/admin/add_admission_reference.html' %}
{% include 'student_management/admin/add_admission_sourse.html' %}
{% endblock content %}
