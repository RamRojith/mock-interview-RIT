{% extends 'base.html' %}
{% load static %}
{% block content %}

<!-- FontAwesome CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Select2 CSS for enhanced dropdown -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<!-- Select2 JS -->
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<style>
/* ========================================
   MANUAL FEE PAYMENT PORTAL STYLES
   ======================================== */
.fee-payment-portal {
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
  min-height: 100vh;
  padding: 2rem 1rem;
}

.fee-payment-portal .page-header {
  max-width: 1000px;
  margin: 0 auto 2rem auto;
  text-align: center;
  padding: 1.5rem;
  background: linear-gradient(135deg, #1a4b8c 0%, #2c5aa0 100%);
  border-radius: 16px;
  color: white;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
}

.fee-payment-portal .page-header h1 {
  font-size: 1.8rem;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.5px;
}

.fee-payment-portal .header-subtitle {
  font-size: 0.9rem;
  opacity: 0.9;
  margin-top: 0.5rem;
  margin-bottom: 0;
}

.fee-payment-portal .page-container {
  max-width: 1000px;
  margin: 0 auto;
}

/* Cards */
.fee-payment-portal .custom-card {
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  border: 1px solid #f1f5f9;
  margin-bottom: 1.5rem;
  overflow: hidden;
  transition: all 0.3s ease;
  animation: fadeInUp 0.5s ease forwards;
  opacity: 0;
}

.fee-payment-portal .custom-card:nth-child(1) { animation-delay: 0.1s; }
.fee-payment-portal .custom-card:nth-child(2) { animation-delay: 0.2s; }

.fee-payment-portal .card-header-custom {
  background: linear-gradient(135deg, #1a4b8c 0%, #2c5aa0 100%);
  padding: 1rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.fee-payment-portal .card-header-custom i {
  font-size: 1.3rem;
  color: white;
}

.fee-payment-portal .card-header-custom h4 {
  font-size: 1.1rem;
  font-weight: 700;
  margin: 0;
  color: white;
}

.fee-payment-portal .card-body-custom {
  padding: 1.5rem;
}

/* Form Labels */
.fee-payment-portal .form-label {
  font-weight: 600;
  color: #1e293b;
  margin-bottom: 0.5rem;
  font-size: 0.85rem;
}

.fee-payment-portal .form-label i {
  color: #1a4b8c;
  width: 20px;
}

.fee-payment-portal .required-star {
  color: #dc2626;
  margin-left: 0.2rem;
}

/* Form Controls */
.fee-payment-portal .form-control,
.fee-payment-portal .form-select {
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 0.7rem 1rem;
  font-size: 0.9rem;
  transition: all 0.2s;
}

.fee-payment-portal .form-control:focus,
.fee-payment-portal .form-select:focus {
  border-color: #1a4b8c;
  box-shadow: 0 0 0 3px rgba(26, 75, 140, 0.1);
  outline: none;
}

.fee-payment-portal .form-control[readonly] {
  background-color: #f8fafc;
  color: #475569;
  border-color: #e2e8f0;
}

/* Input Group */
.fee-payment-portal .input-group {
  border-radius: 12px;
  overflow: hidden;
}

.fee-payment-portal .input-group-text {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-right: none;
  color: #1a4b8c;
  font-weight: 600;
  padding: 0.7rem 1rem;
}

/* Buttons */
.fee-payment-portal .btn-save {
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  color: white;
  border: none;
  border-radius: 12px;
  padding: 0.6rem 1.5rem;
  font-weight: 600;
  transition: all 0.3s;
}

.fee-payment-portal .btn-save:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
}

.fee-payment-portal .btn-reset {
  background: #f1f5f9;
  color: #475569;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 0.6rem 1.5rem;
  font-weight: 600;
  transition: all 0.2s;
}

.fee-payment-portal .btn-reset:hover {
  background: #e2e8f0;
  color: #1e293b;
}

.fee-payment-portal .btn-clear {
  background: linear-gradient(135deg, #64748b 0%, #475569 100%);
  color: white;
  border: none;
  border-radius: 12px;
  padding: 0.6rem 1.5rem;
  font-weight: 600;
  transition: all 0.3s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
}

.fee-payment-portal .btn-clear:hover {
  transform: translateY(-2px);
  background: linear-gradient(135deg, #475569 0%, #334155 100%);
}

/* Select2 Customization */
.fee-payment-portal .select2-container--default .select2-selection--single {
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  height: 46px;
  padding: 0.3rem 0;
}

.fee-payment-portal .select2-container--default .select2-selection--single .select2-selection__rendered {
  line-height: 40px;
  padding-left: 1rem;
  color: #1e293b;
}

.fee-payment-portal .select2-container--default .select2-selection--single .select2-selection__arrow {
  height: 44px;
  right: 8px;
}

.fee-payment-portal .select2-dropdown {
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

.fee-payment-portal .select2-search__field {
  border-radius: 10px !important;
  border: 1px solid #e2e8f0 !important;
  padding: 0.5rem !important;
}

/* Info Row */
.fee-payment-portal .info-row {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}

.fee-payment-portal .info-item {
  flex: 1;
  min-width: 150px;
}

/* Help Text */
.fee-payment-portal .form-text {
  font-size: 0.7rem;
  color: #64748b;
  margin-top: 0.4rem;
}

/* Divider */
.fee-payment-portal .form-divider {
  border-top: 1px solid #e2e8f0;
  margin: 1.5rem 0;
}

/* Animation */
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Responsive */
@media (max-width: 768px) {
  .fee-payment-portal {
    padding: 1rem;
  }
  .fee-payment-portal .page-header {
    padding: 1rem;
  }
  .fee-payment-portal .page-header h1 {
    font-size: 1.4rem;
  }
  .fee-payment-portal .card-body-custom {
    padding: 1rem;
  }
  .fee-payment-portal .info-row {
    flex-direction: column;
    gap: 0.8rem;
  }
  .fee-payment-portal .d-flex.gap-2 {
    flex-direction: column;
  }
  .fee-payment-portal .btn-save,
  .fee-payment-portal .btn-reset,
  .fee-payment-portal .btn-clear {
    width: 100%;
    justify-content: center;
  }
}
</style>

<div class="fee-payment-portal">
  <div class="page-header">
    <h1><i class="fas fa-coins me-2"></i> Manual Fee Payment</h1>
    <p class="header-subtitle">Record and manage student fee payments</p>
  </div>

  <div class="page-container">
    <!-- Student Search Card -->
    <div class="custom-card">
      <div class="card-header-custom">
        <i class="fas fa-user-graduate"></i>
        <h4>Student Search</h4>
      </div>
      <div class="card-body-custom">
        <div class="row g-3 align-items-end">
          <!-- Search Field -->
          <div class="col-md-8 col-sm-12">
            <label for="searchInput" class="form-label">
              <i class="fas fa-search me-1"></i> Search by Name, NRC or Registration Number
            </label>
            <input type="text" class="form-control" id="searchInput" name="search"
                   value="{{ search_query }}" placeholder="Enter student name, NRC or registration number...">
          </div>

          <!-- Clear Button -->
          <div class="col-md-4 col-sm-12">
            <label class="form-label d-none d-md-block">&nbsp;</label>
            <a href="{% url 'manual_fee' %}" class="btn-clear w-100">
              <i class="fas fa-eraser me-2"></i> Clear Search
            </a>
          </div>
        </div>

        <div class="row mt-3">
          <div class="col-md-12">
            <label for="nrcSelect" class="form-label">
              <i class="fas fa-list-dropdown me-1"></i> Select Student
            </label>
            <select class="form-select" id="nrcSelect">
              <option value="" selected hidden>— Select a student from the list —</option>
              {% for student in students %}
                <option value="{{ student.nrc_number }}" data-reg-number="{{ student.reg_number }}">
                  {{ student.reg_number }} - {{ student.nrc_number }} - {{ student.first_name }} {{ student.surname }}
                </option>
              {% endfor %}
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Fee Payment Form Card -->
    <div class="custom-card">
      <div class="card-header-custom">
        <i class="fas fa-receipt"></i>
        <h4>Fee Payment Form</h4>
      </div>
      <div class="card-body-custom">
        <form id="manualFeeForm" method="post" action="{% url 'manual_fee' %}">
          {% csrf_token %}
          <input type="hidden" id="nrcNumber" name="nrc_number" value="">

          <!-- Student Information Section -->
          <div class="info-row">
            <div class="info-item">
              <label for="studentName" class="form-label">
                <i class="fas fa-user me-1"></i> Student Name
              </label>
              <input type="text" class="form-control" id="studentName" name="student_name" readonly placeholder="—">
            </div>
            <div class="info-item">
              <label for="regNumber" class="form-label">
                <i class="fas fa-id-card me-1"></i> Registration Number
              </label>
              <input type="text" class="form-control" id="regNumber" readonly placeholder="—">
            </div>
            <div class="info-item">
              <label for="nrcDisplay" class="form-label">
                <i class="fas fa-passport me-1"></i> NRC Number
              </label>
              <input type="text" class="form-control" id="nrcDisplay" readonly placeholder="—">
            </div>
          </div>

          <!-- Programme Information -->
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="programme" class="form-label">
                <i class="fas fa-graduation-cap me-1"></i> Programme of Study
              </label>
              <input type="text" class="form-control" id="programme" name="programme_of_study" readonly placeholder="—">
            </div>
            <div class="col-md-6">
              <label for="program" class="form-label">
                <i class="fas fa-book me-1"></i> Program
              </label>
              <input type="text" class="form-control" id="program" name="program" readonly placeholder="—">
            </div>
          </div>

          <div class="form-divider"></div>

          <!-- Payment Details -->
          <div class="row g-3">
            <div class="col-md-6">
              <label for="amountPaid" class="form-label">
                <i class="fas fa-money-bill-wave me-1"></i> Amount Paid <span class="required-star">*</span>
              </label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-currency-sign"></i> ZMW</span>
                <input type="number" step="0.01" class="form-control" id="amountPaid" name="amount_paid" 
                       placeholder="0.00" required>
              </div>
              <div class="form-text">
                <i class="fas fa-info-circle me-1"></i>Enter amount in Zambian Kwacha (ZMW)
              </div>
            </div>
            <div class="col-md-6">
              <label for="referenceNumber" class="form-label">
                <i class="fas fa-hashtag me-1"></i> Reference Number
              </label>
              <input type="text" class="form-control" id="referenceNumber" name="reference_number" 
                     placeholder="Optional transaction reference">
              <div class="form-text">
                <i class="fas fa-info-circle me-1"></i>Optional: Bank ref, check number, etc.
              </div>
            </div>
          </div>

          <!-- Form Actions -->
          <div class="d-flex gap-3 justify-content-end mt-4">
            <button type="reset" class="btn-reset">
              <i class="fas fa-times me-2"></i> Reset Form
            </button>
            <button type="submit" class="btn-save">
              <i class="fas fa-save me-2"></i> Save Payment
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('searchInput');
    const nrcSelect = document.getElementById('nrcSelect');
    const studentName = document.getElementById('studentName');
    const regNumber = document.getElementById('regNumber');
    const nrcDisplay = document.getElementById('nrcDisplay');
    const programme = document.getElementById('programme');
    const program = document.getElementById('program');
    const nrcNumber = document.getElementById('nrcNumber');
    
    // Initialize Select2 for better dropdown experience
    if (typeof $.fn.select2 !== 'undefined') {
      $(nrcSelect).select2({
        placeholder: "— Select a student from the list —",
        allowClear: true,
        width: '100%',
        theme: 'default'
      });
    }
    
    // Store original options for search functionality
    let originalOptions = [];
    if (nrcSelect) {
      originalOptions = Array.from(nrcSelect.querySelectorAll('option')).filter(opt => opt.value).map(option => ({
        value: option.value,
        text: option.text,
        regNumber: option.dataset.regNumber
      }));
    }

    // Search functionality
    if (searchInput) {
      searchInput.addEventListener('input', function() {
        const searchTerm = this.value.toLowerCase();
        
        // Clear current select options
        nrcSelect.innerHTML = '<option value="" selected hidden>— Select a student from the list —</option>';
        
        const filteredOptions = originalOptions.filter(option => 
          option.text.toLowerCase().includes(searchTerm)
        );
        
        filteredOptions.forEach(option => {
          const opt = document.createElement('option');
          opt.value = option.value;
          opt.text = option.text;
          opt.dataset.regNumber = option.regNumber;
          nrcSelect.appendChild(opt);
        });
        
        // Refresh Select2
        if (typeof $.fn.select2 !== 'undefined') {
          $(nrcSelect).trigger('change');
        }
      });
    }

    // Auto-fill form when NRC is selected
    if (nrcSelect) {
      nrcSelect.addEventListener('change', function() {
        if (this.value) {
          const selectedOption = this.options[this.selectedIndex];
          
          // Set the registration number (display only)
          regNumber.value = selectedOption.dataset.regNumber || '';
          
          // Set the NRC number (display and hidden field for submission)
          nrcDisplay.value = this.value;
          nrcNumber.value = this.value;
          
          // Fetch additional student details
          fetch(`/fee/api/student-details/${this.value}/`)
            .then(response => response.json())
            .then(data => {
              studentName.value = data.first_name && data.surname ? `${data.first_name} ${data.surname}` : (data.name || '—');
              programme.value = data.programme_of_study || data.programme || '—';
              program.value = data.program_name || data.program || '—';
            })
            .catch(error => {
              console.error('Error fetching student details:', error);
              studentName.value = '—';
              programme.value = '—';
              program.value = '—';
            });
        } else {
          // Clear all fields if no student is selected
          studentName.value = '';
          regNumber.value = '';
          nrcDisplay.value = '';
          nrcNumber.value = '';
          programme.value = '';
          program.value = '';
        }
      });
    }
    
    // Reset form button functionality
    const resetBtn = document.querySelector('button[type="reset"]');
    if (resetBtn) {
      resetBtn.addEventListener('click', function(e) {
        e.preventDefault();
        // Reset all form fields
        document.getElementById('manualFeeForm').reset();
        studentName.value = '';
        regNumber.value = '';
        nrcDisplay.value = '';
        nrcNumber.value = '';
        programme.value = '';
        program.value = '';
        if (typeof $.fn.select2 !== 'undefined') {
          $(nrcSelect).val(null).trigger('change');
        }
      });
    }
});
</script>

{% endblock %}
